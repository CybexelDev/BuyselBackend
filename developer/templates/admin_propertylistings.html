 <script>
    document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const menuButton = document.getElementById("menuButton");
    const closeButton = document.getElementById("closeSidebar");

    function openSidebar() {

        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");

    }

    function closeSidebar() {

        if (window.innerWidth < 1024) {

            sidebar.classList.add("-translate-x-full");
            overlay.classList.add("hidden");

        }

    }

    if (menuButton) {

        menuButton.addEventListener("click", openSidebar);

    }

    if (closeButton) {

        closeButton.addEventListener("click", closeSidebar);

    }

    if (overlay) {

        overlay.addEventListener("click", closeSidebar);

    }

    function checkScreen() {

        if (window.innerWidth >= 1024) {

            sidebar.classList.remove("-translate-x-full");
            overlay.classList.add("hidden");

        } else {

            sidebar.classList.add("-translate-x-full");

        }

    }

    checkScreen();

    window.addEventListener("resize", checkScreen);

});
 </script>

text-green-600

">

    onclick="closeMessageModal()"

    OK
</button>

{% endif %}
<script>


/* =====================================================
   MESSAGE MODAL
===================================================== */

function closeMessageModal(){

    const modal = document.getElementById("messageModal");

    if(modal){
        modal.style.display="none";
    }

}

setTimeout(()=>{

    closeMessageModal();

},3000);

/* =====================================================
   CATEGORY -> SUBCATEGORY
===================================================== */


document.addEventListener("DOMContentLoaded",()=>{


const categorySelect =
document.getElementById("categorySelect");


const subcategorySelect =
document.getElementById("subcategorySelect");


const dynamicContainer =
document.getElementById("dynamicFieldsContainer");



if(categorySelect){


categorySelect.addEventListener("change",function(){


let categoryId=this.value;



subcategorySelect.innerHTML=
`
<option>
Loading...
</option>
`;


dynamicContainer.innerHTML="";



if(!categoryId){

subcategorySelect.innerHTML=
`
<option>
Select Subcategory
</option>
`;

return;

}





let url=
"{% url 'get_subcategories' 0 %}";


url=url.replace("0",categoryId);





fetch(url)

.then(res=>res.json())

.then(data=>{


subcategorySelect.innerHTML=
`
<option value="">
Select Subcategory
</option>
`;



data.forEach(item=>{


subcategorySelect.innerHTML +=

`

<option value="${item.id}">
${item.name}
</option>

`;


});


})

.catch(err=>{


console.log(err);


subcategorySelect.innerHTML=
`
<option>
Error loading
</option>
`;


});



});



}






/* =====================================================
   SUBCATEGORY -> DYNAMIC FIELDS
===================================================== */

if (subcategorySelect) {

    subcategorySelect.addEventListener("change", function () {

        const subId = this.value;

        if (!subId) {
            dynamicContainer.innerHTML = "";
            return;
        }

        dynamicContainer.innerHTML = "<p>Loading...</p>";

        // let url = "{% url 'get_subcategory_fields' 0 %}";
        // url = url.replace("0", subId);
        let url = "{% url 'get_subcategory_fields' 0 %}";
        url = url.replace("0", subId);

        console.log("Final URL:", url);

        fetch(url)
            .then(res => res.json())
            .then(fields => {

                dynamicContainer.innerHTML = "";

                if (!fields.length) {

                    dynamicContainer.innerHTML =
                        "<p>No fields available</p>";

                    return;
                }

                fields.forEach(field => {

                    let html = "";

                    // ==========================
                    // TEXT
                    // ==========================

                    if (field.type === "text") {

                        html = `
                            <input
                                type="text"
                                name="field_${field.id}"
                                class="input"
                                placeholder="${field.name}">
                        `;
                    }

                    // ==========================
                    // NUMBER
                    // ==========================

                    else if (field.type === "number") {

                        html = `
                            <input
                                type="number"
                                name="field_${field.id}"
                                class="input"
                                placeholder="${field.name}">
                        `;
                    }

                    // ==========================
                    // COUNTABLE
                    // ==========================

                    else if (field.type === "countable") {

                        html = `
                            <input
                                type="number"
                                min="0"
                                name="field_${field.id}"
                                class="input"
                                placeholder="${field.name}">
                        `;
                    }

                    // ==========================
                    // BOOLEAN
                    // ==========================

                    else if (field.type === "boolean") {

                        html = `
                            <label class="flex items-center gap-2">
                                <input
                                    type="checkbox"
                                    name="field_${field.id}">
                                Yes
                            </label>
                        `;
                    }

                    // ==========================
                    // SELECT
                    // ==========================

                    else if (field.type === "select") {

                        let options =
                            `<option value="">Select</option>`;

                        field.options.forEach(option => {

                            options += `
                                <option value="${option.name}">
                                    ${option.name}
                                </option>
                            `;

                        });

                        html = `
                            <select
                                name="field_${field.id}"
                                class="input">

                                ${options}

                            </select>
                        `;
                    }

                    // ==========================
                    // MULTI SELECT
                    // ==========================

                    else if (field.type === "multi_select") {

                        let rows = "";

                        field.options.forEach(option => {

                            rows += `
                                <div class="flex items-center gap-3 mb-2">

                                    ${
                                        option.icon
                                        ?
                                        `<img
                                            src="${option.icon}"
                                            class="w-8 h-8 rounded-full">`
                                        :
                                        ""
                                    }

                                    <span class="w-32">
                                        ${option.name}
                                    </span>

                                    <input
                                        type="number"
                                        min="0"
                                        class="multi-count input"
                                        placeholder="Count"
                                        data-option="${option.name}">

                                </div>
                            `;

                        });

                        html = `
                            <div>

                                ${rows}

                                <input
                                    type="hidden"
                                    class="multi-json"
                                    name="field_${field.id}">

                            </div>
                        `;
                    }

                    dynamicContainer.innerHTML += `

                        <div class="bg-white border rounded-xl p-4 shadow">

                            <label class="font-semibold mb-2 block">

                                ${field.name}

                            </label>

                            ${
                                field.icon
                                ?
                                `<img
                                    src="${field.icon}"
                                    class="w-8 h-8 mb-3">`
                                :
                                ""
                            }

                            ${html}

                        </div>

                    `;

                });

                document.querySelectorAll(".multi-json").forEach(hidden => {

                    const parent = hidden.parentElement;

                    const inputs =
                        parent.querySelectorAll(".multi-count");

                    function updateJSON() {

                        const values = [];

                        inputs.forEach(input => {

                            if (input.value !== "") {

                                values.push({

                                    option: input.dataset.option,

                                    value: input.value

                                });

                            }

                        });

                        hidden.value = JSON.stringify(values);

                    }

                    inputs.forEach(input => {

                        input.addEventListener(
                            "input",
                            updateJSON
                        );

                    });

                });

            })

            .catch(error => {

                console.error(error);

                dynamicContainer.innerHTML =
                    "<p>Error loading fields.</p>";

            });

    });

}

});

/* =====================================================
   IMAGE PREVIEW
===================================================== */


document.addEventListener("DOMContentLoaded",()=>{


const imageInput =
document.getElementById("imageInput");


const preview =
document.getElementById("imagePreview");



if(imageInput){



imageInput.addEventListener("change",function(){


preview.innerHTML="";



Array.from(this.files).forEach(file=>{



if(!file.type.startsWith("image/"))
return;




let reader=new FileReader();



reader.onload=function(e){



let div=document.createElement("div");


div.className="relative";



div.innerHTML=

`

<img src="${e.target.result}"

class="w-full h-24 object-cover rounded-lg">


`;



preview.appendChild(div);



};



reader.readAsDataURL(file);



});



});



}



});









/* =====================================================
   AMENITIES MODAL
===================================================== */


let selectedAmenities=[];



function openAmenityModal(){


let modal=document.getElementById("amenityModal");


modal.classList.remove("hidden");

modal.classList.add("flex");


}




function closeAmenityModal(){


let modal=document.getElementById("amenityModal");


modal.classList.add("hidden");

modal.classList.remove("flex");


}




function toggleAmenity(btn){



let id=btn.dataset.id;



if(selectedAmenities.includes(id)){


selectedAmenities =
selectedAmenities.filter(x=>x!==id);


btn.classList.remove(
"bg-[#8bc83f]",
"text-white"
);


}

else{


selectedAmenities.push(id);


btn.classList.add(
"bg-[#8bc83f]",
"text-white"
);



}



}







function applyAmenities(){



let display =
document.getElementById("amenities_display");


let hidden =
document.getElementById("amenities_hidden");



hidden.innerHTML="";


let names=[];



document.querySelectorAll(".amenityBtn")
.forEach(btn=>{



let id=btn.dataset.id;



if(selectedAmenities.includes(id)){



names.push(
btn.innerText.trim()
);




hidden.innerHTML +=

`

<input

type="hidden"

name="amenities"

value="${id}">

`;



}



});




display.value =
names.join(", ");



closeAmenityModal();



}









/* =====================================================
   OWNER PHONE AUTO FILL
===================================================== */


document.addEventListener("DOMContentLoaded",()=>{


const owner =
document.getElementById("owner");


const phone =
document.getElementById("phone");


const whatsapp =
document.getElementById("whatsapp");




if(owner){



owner.addEventListener("change",function(){



let option =
this.options[this.selectedIndex];



let mobile =
option.dataset.phone;



phone.value =
mobile || "";



whatsapp.value =
mobile || "";



let id=this.value;



if(!id)
return;




let url=
"{% url 'get_user_details' 0 %}";


url=url.replace("0",id);




fetch(url)

.then(res=>res.json())

.then(data=>{



let packageSelect =
document.getElementById("packageSelect");



packageSelect.innerHTML=

`
<option value="">
No Package
</option>

`;



if(data.plan_name){



packageSelect.innerHTML +=

`

<option selected>

${data.plan_name}

</option>

`;



}



document.getElementById(
"planValidity"
).value=data.validity || "";



document.getElementById(
"expiryPreview"
).value=data.expiry || "";



document.getElementById(
"planListing"
).value=data.listing || "";




});



});



}



});


/* =====================================================
   KEY SELLING POINTS
===================================================== */


let maxPoints=6;



function toggleKeyPoints(){


document
.getElementById("keyPointsSection")
.classList.toggle("hidden");


}





function addKeyPoint(value = "") {

    let box =
        document.getElementById("keyPointsContainer");

    if (box.children.length >= maxPoints) {

        alert("Maximum 6 points allowed");
        return;

    }

    let div = document.createElement("div");

    div.className =
        "border rounded-xl bg-gray-50 p-4 flex flex-col md:flex-row gap-3 items-stretch md:items-center";

    div.innerHTML = `

        <input
            type="text"
            name="selling_points"
            class="input flex-1"
            value="${value}"
            placeholder="Enter Key Selling Point">

        <button
            type="button"
            onclick="removeRow(this)"
            class="w-full md:w-11 h-11 flex items-center justify-center rounded-lg bg-red-500 hover:bg-red-600 text-white transition">

            <i class="fa-solid fa-trash"></i>

        </button>

    `;

    box.appendChild(div);

}









/* =====================================================
   LANDMARKS
===================================================== */


let maxLandmarks=3;




function toggleLandmarks(){


document

.getElementById("landmarkSection")

.classList.toggle("hidden");


}




function addLandmark() {

    let box =
        document.getElementById("landmarkContainer");

    if (box.children.length >= maxLandmarks) {

        alert("Maximum 3 landmarks allowed");
        return;

    }

    let div = document.createElement("div");

    div.className =
        "border rounded-xl bg-gray-50 p-4 grid grid-cols-1 md:grid-cols-12 gap-4 items-end";

    div.innerHTML = `

        <div class="md:col-span-5">

            <label class="block md:hidden text-sm font-medium mb-1">
                Landmark
            </label>

            <input
                name="landmark_name"
                class="input w-full"
                placeholder="Hospital">

        </div>

        <div class="md:col-span-5">

            <label class="block md:hidden text-sm font-medium mb-1">
                Distance
            </label>

            <input
                name="landmark_distance"
                class="input w-full"
                placeholder="2 KM">

        </div>

        <div class="md:col-span-2 flex justify-center md:justify-end">

            <button
                type="button"
                onclick="removeRow(this)"
                class="w-full md:w-11 h-11 flex items-center justify-center rounded-lg bg-red-500 hover:bg-red-600 text-white transition">

                <i class="fa-solid fa-trash"></i>

            </button>

        </div>

    `;

    box.appendChild(div);

}




function removeRow(btn){


btn.parentElement.remove();


}
