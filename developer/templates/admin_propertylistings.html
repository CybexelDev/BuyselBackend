<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buysel Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

</head>

<body class="bg-gray-100 font-sans h-screen overflow-hidden">

<div class="flex h-screen p-2">

<!-- SIDEBAR -->
<div class="w-72 bg-[#8bc83f] text-white p-7 flex flex-col justify-between rounded-l-3xl shadow-2xl">

<div>

<!-- LOGO -->
<div class="flex items-center gap-4 mb-12">
<div class="w-12 h-12 rounded-full bg-white text-[#8bc83f] flex items-center justify-center font-bold text-lg">
BA
</div>

<h1 class="text-2xl font-bold">
Buysel Admin
</h1>
</div>


<!-- MENU -->
<nav class="space-y-3">

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-chart-column"></i>
Dashboard
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-layer-group"></i>
Categories
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl bg-white text-[#151a37]">
<i class="fa-solid fa-bolt"></i>
Add Property
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-user-tie"></i>
Add Agents
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-house"></i>
Property Requests
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-user-plus"></i>
Agents Register
</a>

</nav>

</div>

</div>


<!-- MAIN CONTENT -->
<div class="flex-1 flex flex-col bg-white rounded-tr-3xl rounded-br-3xl shadow-lg ">

<!-- TOP BAR -->
<div class="flex items-center justify-between px-10 py-5 border-b bg-white rounded-tr-3xl">

<!-- LEFT -->
<h2 class="text-2xl font-semibold text-gray-700">
Add Your Property
</h2>

<!-- CENTER SEARCH -->

<!--<input-->
<!--type="text"-->
<!--placeholder="Search..."-->
<!--class="w-full border rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-[#8bc83f]"-->
<!--&gt;-->

<!--<i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>-->

<!--</div>-->


<!-- RIGHT -->
<div class="flex items-center gap-6">

<button class="text-gray-500 hover:text-gray-700 text-xl">
<i class="fa fa-bell"></i>
</button>

<button class="text-gray-500 hover:text-gray-700 text-xl">
<i class="fa fa-envelope"></i>
</button>

<!--<div class="flex items-center gap-3">-->



<!--<span class="font-medium text-gray-700">-->
<!--Admin-->
<!--</span>-->

<!--</div>-->

</div>

</div>

<!-- PAGE CONTENT -->
<div class="p-10 overflow-y-auto overflow-x-hidden">

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<!-- ================= TOP GRID ================= -->
<div class="grid grid-cols-3 gap-6">

<div>
<label class="label">Category *</label>
<select name="category" id="categorySelect" class="input" required>
<option value="">Select Category</option>
{% for cat in categories %}
<option value="{{cat.id}}">{{cat.name}}</option>
{% endfor %}
</select>
</div>

<div>
<label class="label">Subcategory</label>
<select name="subcategory" id="subcategorySelect" class="input">
<option value="">Select Subcategory</option>
</select>
</div>

<div>
<label class="label">Purpose *</label>
<select name="purpose" class="input" required>
<option value="">Select Purpose</option>
{% for p in purposes %}
<option value="{{p.id}}">{{p.name}}</option>
{% endfor %}
</select>
</div>

</div>

<!-- ================= DYNAMIC FIELDS ================= -->
<div id="dynamicFieldsContainer"
class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6"></div>

<!-- ================= BASIC ================= -->
<div class="grid grid-cols-3 gap-6 py-4">
<input type="text" name="label" class="input" placeholder="Label *" required>
<input type="text" name="land_area" class="input" placeholder="Land Area *" required>
<input type="text" name="sq_ft" class="input" placeholder="Square Feet">
</div>

<!-- ================= DESCRIPTION ================= -->
<div class="grid grid-cols-2 gap-6 py-4">
<textarea name="description" class="input h-28" required placeholder="Description *"></textarea>
<textarea name="message" class="input h-28" placeholder="Message"></textarea>
</div>

<!-- ================= IMAGE UPLOAD ================= -->
<div class="py-4">
<label class="label">Upload Images</label>
<input type="file" name="images" id="imageInput" multiple class="input" accept="image/*">
<div id="imagePreview" class="grid grid-cols-2 md:grid-cols-6 gap-3 mt-3"></div>
</div>

<!-- ================= AMENITIES + PRICE ================= -->
<div class="grid grid-cols-3 gap-6 py-4">

<div>
<input type="text" id="amenities_display"
class="input cursor-pointer"
placeholder="Select Amenities" readonly>
<div id="amenities_hidden"></div>
</div>

<div>
<input type="text" name="perprice" class="input" placeholder="Price Per Acre/cent">
</div>

<div>
<input type="text" name="price" class="input" placeholder="Total Price " required>
</div>

</div>

<!-- ================= OWNER ================= -->
<div class="grid grid-cols-3 gap-6 py-4">

<select name="owner" id="owner" class="input" required>
<option value="">Select Owner</option>
{% for user in users %}
<option value="{{ user.id }}" data-phone="{{ user.mobile }}">
{{ user.name }}
</option>
{% endfor %}
</select>

<input type="text" id="phone" name="phone" class="input" placeholder="Phone *" required>
<input type="text" name="whatsapp" class="input" placeholder="WhatsApp *" required>

</div>

<!-- ================= PACKAGE ================= -->
<div class="grid grid-cols-3 gap-6 py-4">

<select name="package" id="packageSelect" class="input">
<option value="">Select Package</option>
{% for plan in plans %}
<option value="{{ plan.id }}"
        data-validity="{{ plan.validity }}"
        data-listing="{{ plan.listing }}">
    {{ plan.name }}
</option>
{% endfor %}
</select>

<input type="text" id="planValidity" class="input bg-gray-100" placeholder="Validity" readonly>
<input type="text" id="planListing" class="input bg-gray-100" placeholder="Listing Limit" readonly>

</div>

<!-- ================= LOCATION ================= -->
<div class="grid grid-cols-3 gap-6 py-4">
<input name="city" class="input" placeholder="City *" required>
<input name="village" class="input" placeholder="Village">
<input name="taluk" class="input" placeholder="Taluk">
</div>

<div class="grid grid-cols-3 gap-6 py-4">
<input name="pincode" class="input" placeholder="Pincode *" required>
<input name="district" class="input" placeholder="District *" required>
<input name="state" class="input" placeholder="State *" required>
</div>

<div class="grid grid-cols-3 gap-6 py-4">
<input name="land_mark" class="input" placeholder="Landmark">
<input name="location" type="url" class="input" placeholder="Google Location" required>
<input name="added_by" value="{{ request.user.username }}" readonly class="input bg-gray-100">
</div>

<input type="hidden" name="paid" value="no">

<button class="bg-[#8bc83f] text-white px-6 py-2 rounded mt-4">
Add Property
</button>

</form>
</div>

<!-- ================= AMENITY MODAL ================= -->
<div id="amenityModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
<div class="bg-white w-[600px] rounded-xl shadow-lg">

<div class="flex justify-between p-4 border-b">
<h2 class="font-semibold">Select Amenities</h2>
<button onclick="closeAmenityModal()">✕</button>
</div>

<div class="p-4 grid grid-cols-3 gap-3 max-h-[300px] overflow-y-auto">
{% for amenity in amenities %}
<button type="button" class="amenity-btn border p-2 rounded"
data-id="{{ amenity.id }}" data-name="{{ amenity.name }}">
{{ amenity.name }}
</button>
{% endfor %}
</div>

<div class="flex justify-end gap-3 p-4 border-t">
<button onclick="closeAmenityModal()">Cancel</button>
<button onclick="saveAmenities()" class="bg-green-600 text-white px-4 py-1 rounded">Save</button>
</div>

</div>
</div>

<!-- ================= SCRIPT ================= -->
<script>

const SUBCATEGORY_URL = "{% url 'get_subcategories' 0 %}";
const FIELD_URL = "{% url 'get_subcategory_fields' 0 %}";

/* CATEGORY → SUBCATEGORY */
categorySelect.onchange = function () {
let id = this.value;

if(!id){
subcategorySelect.innerHTML = `<option value="">Select Subcategory</option>`;
dynamicFieldsContainer.innerHTML = "";
return;
}

fetch(SUBCATEGORY_URL.replace("0", id))
.then(res => res.json())
.then(data => {
subcategorySelect.innerHTML = `<option value="">Select Subcategory</option>`;
data.forEach(sub => {
subcategorySelect.innerHTML += `<option value="${sub.id}">${sub.name}</option>`;
});
});
};

/* SUBCATEGORY → FIELDS */
subcategorySelect.onchange = function () {
let id = this.value;
dynamicFieldsContainer.innerHTML = "";

if(!id) return;

fetch(FIELD_URL.replace("0", id))
.then(res => res.json())
.then(data => {

data.forEach(field => {

let input = "";

if(field.type === "number"){
input = `<input type="number" name="field_${field.id}" class="input">`;
}
else if(field.type === "boolean"){
input = `<input type="checkbox" name="field_${field.id}">`;
}
else{
input = `<input type="text" name="field_${field.id}" class="input">`;
}

dynamicFieldsContainer.innerHTML += `
<div>
<label>${field.name}</label>
${input}
</div>`;
});

});
};

/* IMAGE PREVIEW */
imageInput.onchange = function(){
imagePreview.innerHTML = "";

Array.from(this.files).forEach(file => {
let reader = new FileReader();
reader.onload = e => {
imagePreview.innerHTML += `<img src="${e.target.result}" class="preview-img">`;
};
reader.readAsDataURL(file);
});
};

/* OWNER PHONE AUTO */
owner.onchange = function(){
phone.value = this.selectedOptions[0].dataset.phone || "";
};

/* PACKAGE AUTO FILL */
packageSelect.onchange = function(){
let opt = this.selectedOptions[0];

planValidity.value = opt.dataset.validity ? opt.dataset.validity + " days" : "";
planListing.value = opt.dataset.listing || "";
};

/* AMENITIES */
let selectedAmenities = new Set();

amenities_display.onclick = () => amenityModal.classList.remove("hidden");

function closeAmenityModal(){
amenityModal.classList.add("hidden");
}

document.querySelectorAll(".amenity-btn").forEach(btn=>{
btn.onclick = function(){
let id = this.dataset.id;

if(selectedAmenities.has(id)){
selectedAmenities.delete(id);
this.classList.remove("active");
}else{
selectedAmenities.add(id);
this.classList.add("active");
}
};
});

function saveAmenities(){
let names = [];
let hidden = "";

selectedAmenities.forEach(id=>{
let btn = document.querySelector(`.amenity-btn[data-id='${id}']`);
names.push(btn.dataset.name);
hidden += `<input type="hidden" name="amenities" value="${id}">`;
});

amenities_display.value = names.join(", ");
amenities_hidden.innerHTML = hidden;

closeAmenityModal();
}

</script>
