<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buysel Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

</head>

<body class="bg-gray-100 font-sans h-screen overflow-hidden">

<div class="flex h-screen p-2">

<!-- SIDEBAR -->
<div class="w-72 bg-[#8bc83f] text-white p-7 flex flex-col justify-between rounded-l-3xl shadow-2xl">

<div>

<!-- LOGO -->
<div class="flex items-center gap-4 mb-12">
<div class="w-12 h-12 rounded-full bg-white text-[#8bc83f] flex items-center justify-center font-bold text-lg">
BA
</div>

<h1 class="text-2xl font-bold">
Buysel Admin
</h1>
</div>


<!-- MENU -->
<nav class="space-y-3">

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-chart-column"></i>
Dashboard
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-layer-group"></i>
Categories
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl bg-white text-[#151a37]">
<i class="fa-solid fa-bolt"></i>
Add Property
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-user-tie"></i>
Add Agents
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-house"></i>
Property Requests
</a>

<a class="flex items-center gap-4 py-3 px-4 rounded-xl hover:bg-white hover:text-[#151a37]">
<i class="fa-solid fa-user-plus"></i>
Agents Register
</a>

</nav>

</div>

</div>


<!-- MAIN CONTENT -->
<div class="flex-1 flex flex-col bg-white rounded-tr-3xl rounded-br-3xl shadow-lg ">

<!-- TOP BAR -->
<div class="flex items-center justify-between px-10 py-5 border-b bg-white rounded-tr-3xl">

<!-- LEFT -->
<h2 class="text-2xl font-semibold text-gray-700">
Add Your Property
</h2>

<!-- CENTER SEARCH -->

<!--<input-->
<!--type="text"-->
<!--placeholder="Search..."-->
<!--class="w-full border rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-[#8bc83f]"-->
<!--&gt;-->

<!--<i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>-->

<!--</div>-->


<!-- RIGHT -->
<div class="flex items-center gap-6">

<button class="text-gray-500 hover:text-gray-700 text-xl">
<i class="fa fa-bell"></i>
</button>

<button class="text-gray-500 hover:text-gray-700 text-xl">
<i class="fa fa-envelope"></i>
</button>

<!--<div class="flex items-center gap-3">-->



<!--<span class="font-medium text-gray-700">-->
<!--Admin-->
<!--</span>-->

<!--</div>-->

</div>

</div>

<!-- PAGE CONTENT -->
<div class="p-10 overflow-y-auto overflow-x-hidden">

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<!-- ================= TOP GRID ================= -->
<div class="grid grid-cols-3 gap-6">

<div>
<label class="label">Category *</label>
<select name="category" id="categorySelect" class="input" required>
<option value="">Select Category</option>
{% for cat in categories %}
<option value="{{cat.id}}">{{cat.name}}</option>
{% endfor %}
</select>
</div>

<div>
<label class="label">Subcategory</label>
<select name="subcategory" id="subcategorySelect" class="input">
<option value="">Select Subcategory</option>
</select>
</div>

<div>
<label class="label">Purpose *</label>
<select name="purpose" class="input" required>
<option value="">Select Purpose</option>
{% for p in purposes %}
<option value="{{p.id}}">{{p.name}}</option>
{% endfor %}
</select>
</div>

</div>

<!-- ================= DYNAMIC FIELDS ================= -->
<div id="dynamicFieldsContainer"
class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6"></div>

<!-- ================= BASIC ================= -->
<div class="grid grid-cols-3 gap-6 py-4">
<input type="text" name="label" class="input" placeholder="Label *" required>
<input type="text" name="land_area" class="input" placeholder="Land Area *" required>
<input type="text" name="sq_ft" class="input" placeholder="Square Feet">
</div>

<!-- ================= DESCRIPTION ================= -->
<div class="grid grid-cols-2 gap-6 py-4">
<textarea name="description" class="input h-28" required placeholder="Description *"></textarea>
<textarea name="message" class="input h-28" placeholder="Message"></textarea>
</div>

<!-- ================= IMAGE UPLOAD ================= -->
<div class="py-4">
<label class="label">Upload Images *</label>
<input type="file" name="images" id="imageInput" multiple class="input" accept="image/*" required>
<div id="imagePreview" class="grid grid-cols-2 md:grid-cols-6 gap-3 mt-3"></div>
</div>

<!-- ================= AMENITIES + PRICE ================= -->
<div class="grid grid-cols-3 gap-6 py-4">

<div>
  <input type="text" id="amenities_display"
         class="input cursor-pointer"
         placeholder="Select Amenities"
         readonly
         onclick="openAmenityModal()">
  <div id="amenities_hidden"></div>
</div>

<div>
<input type="text" name="perprice" class="input" placeholder="Price Per Acre/cent">
</div>

<div>
<input type="text" name="price" class="input" placeholder="Total Price" required>
</div>

</div>

<!-- ================= OWNER ================= -->
<div class="grid grid-cols-3 gap-6 py-4">

    <div>
        <label class="label">Owner *</label>
        <select name="owner" id="owner" class="input" required>
            <option value="">Select Owner</option>
            {% for user in users %}
            <option value="{{ user.id }}" data-phone="{{ user.mobile }}">
                {{ user.name }} ({{ user.user_id }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label class="label">Phone *</label>
        <input type="text" id="phone" name="phone" class="input" placeholder="Phone" required>
    </div>

    <div>
        <label class="label">WhatsApp *</label>
        <input type="text" name="whatsapp" id="whatsapp" class="input" placeholder="WhatsApp" required>
    </div>

</div>

<!-- ================= PACKAGE ================= -->
<div class="grid grid-cols-3 gap-6 py-4">

    <div>
        <label class="label">Package</label>
        <select name="package" id="packageSelect" class="input">
            <option value="">No Package</option>
        </select>
    </div>

    <div>
        <label class="label">Validity (Days)</label>
        <input type="text" id="planValidity" class="input bg-gray-100" readonly>
    </div>

    <div class="hidden">
        <label class="label">Listing Limit</label>
        <input type="text" id="planListing" class="input  " readonly>
    </div>

    <div>
        <label class="label">Expiry Date</label>
        <input type="text" id="expiryPreview" class="input bg-gray-100" readonly>
    </div>

</div>

<!-- ================= LOCATION ================= -->
<div class="grid grid-cols-3 gap-6 py-4">
<input name="city" class="input" placeholder="City *" required>
<input name="village" class="input" placeholder="Village">
<input name="taluk" class="input" placeholder="Taluk">
</div>

<div class="py-4">

    <!-- TITLE OUTSIDE GRID -->
    <label class="block text-lg font-semibold mb-4">
        Property Highlights
    </label>

    <!-- 2 COLUMN LAYOUT -->
    <div class="grid grid-cols-2 gap-8">

        <!-- ================= KEY POINTS ================= -->
        <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
            <button type="button"
                    onclick="toggleKeyPoints()"
                    class="w-full px-4 py-2 border border-[#8bc83f] text-[#8bc83f] bg-transparent rounded hover:bg-[#8bc83f] hover:text-white transition">
                + Add Key Points
            </button>

            <div id="keyPointsSection" class="hidden mt-4">
                <div id="keyPointsContainer" class="space-y-3"></div>

                <button type="button"
                        onclick="addKeyPoint()"
                        class="mt-3 w-full px-4 py-2 bg-green-600 text-white rounded">
                    + Add Point
                </button>
            </div>
        </div>

        <!-- ================= LANDMARKS ================= -->
        <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
            <button type="button"
                    onclick="toggleLandmarks()"
                    class="w-full px-4 py-2 border border-[#8bc83f] text-[#8bc83f] bg-transparent rounded hover:bg-[#8bc83f] hover:text-white transition">
                + Add Landmarks
            </button>

            <div id="landmarkSection" class="hidden mt-4">

                <!-- HEADER -->
                <div class="grid grid-cols-3 gap-4 mb-2 font-medium text-sm">
                    <div>Landmark</div>
                    <div>Distance</div>
                    <div></div>
                </div>

                <!-- ROWS -->
                <div id="landmarkContainer" class="space-y-3"></div>

                <button type="button"
                        onclick="addLandmark()"
                        class="mt-3 w-full px-4 py-2 bg-green-600 text-white rounded">
                    + Add Landmark
                </button>
            </div>
        </div>

    </div>
</div>



<div class="grid grid-cols-3 gap-6 py-4">
<input name="pincode" class="input" placeholder="Pincode *" required>
<input name="district" class="input" placeholder="District *" required>
<input name="state" class="input" placeholder="State *" required>
</div>

<div class="grid grid-cols-3 gap-6 py-4">

<script>
document.addEventListener("DOMContentLoaded", function () {

    const categorySelect = document.getElementById("categorySelect");
    const subcategorySelect = document.getElementById("subcategorySelect");
    const dynamicFieldsContainer = document.getElementById("dynamicFieldsContainer");

    // ================= LOAD SUBCATEGORIES =================
    categorySelect.addEventListener("change", function () {
        const categoryId = this.value;

        subcategorySelect.innerHTML = '<option>Loading...</option>';
        dynamicFieldsContainer.innerHTML = "";

        if (!categoryId) return;

        let url = "{% url 'get_subcategories' 0 %}";
        url = url.replace('0', categoryId);

        fetch(url)
            .then(res => res.json())
            .then(data => {
                subcategorySelect.innerHTML = '<option value="">Select Subcategory</option>';

                data.forEach(sub => {
                    subcategorySelect.innerHTML += `
                        <option value="${sub.id}">${sub.name}</option>
                    `;
                });
            })
            .catch(err => {
                console.error("Subcategory error:", err);
                subcategorySelect.innerHTML = '<option>Error loading</option>';
            });
    });


    // ================= LOAD FIELDS (BOX UI) =================
    subcategorySelect.addEventListener("change", function () {
        const subcategoryId = this.value;

        dynamicFieldsContainer.innerHTML = "Loading...";

        if (!subcategoryId) {
            dynamicFieldsContainer.innerHTML = "";
            return;
        }

        let url = "{% url 'get_subcategory_fields' 0 %}";
        url = url.replace('0', subcategoryId);

        fetch(url)
            .then(res => res.json())
            .then(fields => {

                dynamicFieldsContainer.innerHTML = "";

                if (!fields.length) {
                    dynamicFieldsContainer.innerHTML = "<p>No fields found</p>";
                    return;
                }

                fields.forEach(field => {

                    let inputHTML = "";

                    if (field.type === "number") {
                        inputHTML = `<input type="number" name="field_${field.id}" class="input w-full" placeholder="${field.name}">`;
                    }
                    else if (field.type === "date") {
                        inputHTML = `<input type="date" name="field_${field.id}" class="input w-full">`;
                    }
                    else {
                        inputHTML = `<input type="text" name="field_${field.id}" class="input w-full" placeholder="${field.name}">`;
                    }

                    dynamicFieldsContainer.innerHTML += `
                        <div class="bg-white shadow-md rounded-xl p-4 border hover:shadow-lg transition">

                            ${field.icon ? `<img src="${field.icon}" class="w-6 h-6 mb-2">` : ""}

                            <label class="block text-sm font-semibold mb-1">
                                ${field.name}
                            </label>

                            ${inputHTML}

                        </div>
                    `;
                });

            })
            .catch(err => {
                console.error("Field error:", err);
                dynamicFieldsContainer.innerHTML = "Error loading fields";
            });
    });

});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const imageInput = document.getElementById("imageInput");
    const imagePreview = document.getElementById("imagePreview");

    const MAX_FILES = 10;

    imageInput.addEventListener("change", function () {

        const files = Array.from(this.files);

        // ❌ Limit check
        if (files.length > MAX_FILES) {
            alert("You can upload maximum 10 images only");
            this.value = ""; // reset input
            imagePreview.innerHTML = "";
            return;
        }

        imagePreview.innerHTML = "";

        files.forEach(file => {

            if (!file.type.startsWith("image/")) return;

            const reader = new FileReader();

            reader.onload = function (e) {

                const div = document.createElement("div");
                div.className = "relative";

                div.innerHTML = `
                    <img src="${e.target.result}"
                         class="w-full h-24 object-cover rounded-lg shadow">

                    <button type="button"
                        class="absolute top-1 right-1 bg-red-500 text-white text-xs px-2 py-1 rounded"
                        onclick="this.parentElement.remove()">
                        ✕
                    </button>
                `;

                imagePreview.appendChild(div);
            };

            reader.readAsDataURL(file);
        });

    });

});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

            .then(res => res.json())
            .then(data => {

                planListing.value = data.listing || "";
                expiryPreview.value = data.expiry || "";

            })
            .catch(err => {
                console.error("User fetch error:", err);
            });

<script>
let selectedAmenities = [];

// Open / Close
function openAmenityModal() {
    document.getElementById("amenityModal").classList.remove("hidden");
    document.getElementById("amenityModal").classList.add("flex");
}

function closeAmenityModal() {
    document.getElementById("amenityModal").classList.add("hidden");
    document.getElementById("amenityModal").classList.remove("flex");
}

// Toggle button selection
function toggleAmenity(btn) {
    const id = btn.getAttribute("data-id");

    if (selectedAmenities.includes(id)) {
        // remove
        selectedAmenities = selectedAmenities.filter(i => i !== id);
        btn.classList.remove("bg-green-500", "text-white");
        btn.classList.add("bg-white");
    } else {
        // add
        selectedAmenities.push(id);
        btn.classList.add("bg-green-500", "text-white");
    }
}

// Apply selection
function applyAmenities() {
    const displayInput = document.getElementById("amenities_display");
    const hiddenContainer = document.getElementById("amenities_hidden");

    let names = [];
    hiddenContainer.innerHTML = "";

    document.querySelectorAll(".amenityBtn").forEach(btn => {
        const id = btn.getAttribute("data-id");

        if (selectedAmenities.includes(id)) {
            names.push(btn.textContent.trim());

            // hidden input for Django
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "amenities[]";
            input.value = id;

            hiddenContainer.appendChild(input);
        }
    });

    displayInput.value = names.join(", ");
    closeAmenityModal();
}

// Close on outside click
document.addEventListener("DOMContentLoaded", function () {
    const modal = document.getElementById("amenityModal");
    modal.addEventListener("click", function(e) {
        if (e.target === modal) closeAmenityModal();
    });
});
</script>


<script>
let maxPoints = 6;
let maxLandmarks = 3;

// ================= TOGGLE =================
function toggleKeyPoints() {
    const section = document.getElementById("keyPointsSection");
    section.classList.toggle("hidden");

    if (!section.classList.contains("hidden") &&
        document.getElementById("keyPointsContainer").children.length === 0) {
        addKeyPoint();
    }
}

function toggleLandmarks() {
    const section = document.getElementById("landmarkSection");
    section.classList.toggle("hidden");

    if (!section.classList.contains("hidden") &&
        document.getElementById("landmarkContainer").children.length === 0) {
        addLandmark();
    }
}

// ================= KEY POINTS =================
function addKeyPoint(value = "") {
    const container = document.getElementById("keyPointsContainer");

    if (container.children.length >= maxPoints) {
        alert("Maximum 6 key points allowed");
        return;
    }

    const div = document.createElement("div");
    div.className = "flex gap-4 items-center";

    div.innerHTML = `
        <input type="text"
               name="key_selling_points"
               value="${value}"
               placeholder="Enter key point"
               class="input w-full">

        <button type="button"
                onclick="removeRow(this)"
                class="bg-red-500 text-white px-3 py-2 rounded">
           <i class="fa-solid fa-xmark"></i>
        </button>
    `;

    container.appendChild(div);
}

// ================= LANDMARK =================
function addLandmark(name = "", distance = "") {
    const container = document.getElementById("landmarkContainer");

    if (container.children.length >= maxLandmarks) {
        alert("Maximum 3 landmarks allowed");
        return;
    }

    const div = document.createElement("div");

    // Better grid control
    div.className = "grid grid-cols-[2fr_1fr_auto] gap-4 items-center";

    div.innerHTML = `
        <input type="text"
               name="landmark_name"
               value="${name}"
               placeholder="Landmark"
               class="input">

        <input type="text"
               name="landmark_distance"
               value="${distance}"
               placeholder="Distance (e.g. 2 km)"
               class="input">

        <button type="button"
                onclick="removeRow(this)"
                class="bg-red-500 text-white px-2 py-2 rounded flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
        </button>
    `;

    container.appendChild(div);
}
// ================= REMOVE =================
function removeRow(btn) {
    btn.parentElement.remove();
}
</script>
