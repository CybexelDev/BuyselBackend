<!-- ====================================================== -->
<!-- EDIT BANNER MODAL -->
<!-- ====================================================== -->

<div id="editBannerModal"
     class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">

    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-fadeIn">

        <!-- Header -->

        <div class="flex items-center justify-between px-6 py-5 border-b">

            <div>

                <h2 class="text-2xl font-bold text-gray-800">

                    Edit Hero Banner

                </h2>

                <p class="text-gray-500 text-sm mt-1">

                    Update banner information.

                </p>

            </div>

            <button
                type="button"
                onclick="closeModal('editBannerModal')"
                class="w-10 h-10 rounded-full bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 transition">

                <i class="fa-solid fa-xmark text-lg"></i>

            </button>

        </div>

        <!-- Form -->

        <form
            id="editBannerForm"
            method="POST"
            enctype="multipart/form-data"
            class="p-6 space-y-6">

            {% csrf_token %}

            <!-- Current Banner -->

            <div>

                <label class="block text-sm font-semibold text-gray-700 mb-2">

                    Current Banner

                </label>

                <img
                    id="edit_banner_preview"
                    src=""
                    class="w-full h-64 rounded-2xl object-cover border">

            </div>

            <!-- Upload -->

            <div>

                <label class="block text-sm font-semibold text-gray-700 mb-2">

                    Replace Banner

                </label>

                <input
                    id="edit_banner_image"
                    name="image"
                    type="file"
                    accept="image/*"
                    class="block w-full rounded-xl border border-gray-300 px-4 py-3">

            </div>

            <!-- Status -->

            <div class="flex items-center gap-3">

                <input
                    id="edit_banner_status"
                    name="is_active"
                    type="checkbox"
                    class="w-5 h-5 rounded text-blue-600">

                <label
                    for="edit_banner_status"
                    class="font-medium text-gray-700">

                    Active Banner

                </label>

            </div>

            <!-- Footer -->

            <div class="flex justify-end gap-3 pt-6 border-t">

                <button
                    type="button"
                    onclick="closeModal('editBannerModal')"
                    class="px-6 py-3 rounded-xl border border-gray-300 hover:bg-gray-100">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="px-8 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold">

                    <i class="fa-solid fa-floppy-disk mr-2"></i>

                    Update Banner

                </button>

            </div>

        </form>

    </div>

</div>
