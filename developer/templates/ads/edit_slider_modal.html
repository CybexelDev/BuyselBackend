<!-- ====================================================== -->
<!-- EDIT SLIDER MODAL -->
<!-- ====================================================== -->

<div id="editSliderModal"
     class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">

    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">

        <!-- Header -->

        <div class="flex items-center justify-between px-6 py-5 border-b">

            <div>

                <h2 class="text-2xl font-bold">

                    Edit Slider Image

                </h2>

                <p class="text-sm text-gray-500">

                    Update slider image.

                </p>

            </div>

            <button
                type="button"
                onclick="closeModal('editSliderModal')"
                class="w-10 h-10 rounded-full bg-gray-100 hover:bg-red-100">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <!-- Form -->

        <form
            id="editSliderForm"
            method="POST"
            enctype="multipart/form-data"
            class="p-6 space-y-6">

            {% csrf_token %}

            <!-- Current Image -->

            <div>

                <label class="block font-semibold mb-2">

                    Current Slider

                </label>

                <img
                    id="edit_slider_preview"
                    src=""
                    class="w-full h-64 rounded-xl object-cover border">

            </div>

            <!-- Replace -->

            <div>

                <label class="block font-semibold mb-2">

                    Replace Image

                </label>

                <input
                    id="edit_slider_image"
                    name="image"
                    type="file"
                    accept="image/*"
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <!-- Status -->

            <div class="flex items-center gap-3">

                <input
                    id="edit_slider_status"
                    name="is_active"
                    type="checkbox"
                    class="w-5 h-5">

                <label for="edit_slider_status">

                    Active Slider

                </label>

            </div>

            <!-- Footer -->

            <div class="flex justify-end gap-3 border-t pt-6">

                <button
                    type="button"
                    onclick="closeModal('editSliderModal')"
                    class="px-6 py-3 border rounded-xl">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white">

                    <i class="fa-solid fa-floppy-disk mr-2"></i>

                    Update Slider

                </button>

            </div>

        </form>

    </div>

</div>
