<div id="statusModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">

        <div class="flex items-center justify-between px-6 py-4 border-b">

            <h2 class="text-xl font-bold text-gray-800">

                Update Status

            </h2>

            <button onclick="closeStatusModal()"
                class="w-10 h-10 rounded-full hover:bg-gray-100">

                <i class="fa-solid fa-xmark text-xl"></i>

            </button>

        </div>

        <form
            id="statusForm"
            method="POST">

            {% csrf_token %}

            <div class="p-6">

                <label class="block text-sm font-medium mb-2">

                    Select Status

                </label>

                <select
                    id="statusSelect"
                    name="status"
                    class="w-full rounded-xl border px-4 py-3 focus:ring-2 focus:ring-blue-500">

                    <!-- Filled by JavaScript -->

                </select>

            </div>

            <div class="px-6 py-4 border-t flex justify-end gap-3">

                <button
                    type="button"
                    onclick="closeStatusModal()"
                    class="px-5 py-2 rounded-xl bg-gray-500 hover:bg-gray-600 text-white">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white">

                    Update Status

                </button>

            </div>

        </form>

    </div>

</div>
