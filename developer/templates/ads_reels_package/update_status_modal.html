<!-- ====================================================== -->
<!-- UPDATE STATUS MODAL -->
<!-- ====================================================== -->

<div
    id="statusModal"
    class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">

    <div class="status-modal-card">

        <!-- Header -->
        <div class="status-modal-header">

            <div class="status-modal-title-wrap">

                <div class="status-modal-icon">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>

                <div>
                    <span class="status-modal-eyebrow">
                        Request Workflow
                    </span>

                    <h2>
                        Update Status
                    </h2>

                    <p>
                        Select the latest progress stage for this request.
                    </p>
                </div>

            </div>

            <button
                type="button"
                onclick="closeStatusModal()"
                class="status-modal-close-btn"
                aria-label="Close modal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <!-- Form -->
        <form
            id="statusForm"
            method="POST"
            class="status-modal-form">

            {% csrf_token %}

            <div class="status-modal-content">

                <div class="status-info-card">

                    <div class="status-info-icon">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>

                    <div>
                        <strong>Change request progress</strong>
                        <p>
                            Choose the most accurate status before saving the update.
                        </p>
                    </div>

                </div>

                <div class="status-field-group">

                    <label for="statusSelect">
                        Select Status
                    </label>

                    <div class="status-select-wrap">

                        <i class="fa-solid fa-list-check status-select-leading-icon"></i>

                        <select
                            id="statusSelect"
                            name="status"
                            class="status-select">

                            <!-- Filled by JavaScript -->

                        </select>

                        <span class="status-select-arrow">
                            <i class="fa-solid fa-chevron-down"></i>
                        </span>

                    </div>

                    <p class="status-field-help">
                        The available options are based on the selected request type.
                    </p>

                </div>

            </div>

            <!-- Footer -->
            <div class="status-modal-footer">

                <button
                    type="button"
                    onclick="closeStatusModal()"
                    class="status-cancel-btn">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="status-update-btn">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Update Status

                </button>

            </div>

        </form>

    </div>

</div>

<style>
:root {
    --status-green: #8bc83f;
    --status-green-dark: #659d28;
    --status-green-soft: #f2f9e8;
    --status-border: #dce8d2;
    --status-text: #273221;
    --status-muted: #7e8978;
}

.status-modal-card {
    width: 100%;
    max-width: 520px;
    overflow: hidden;
    border: 1px solid rgba(139, 200, 63, .18);
    border-radius: 25px;
    background: #fff;
    box-shadow: 0 30px 85px rgba(31, 48, 22, .30);
    animation: statusModalIn .22s ease;
}

.status-modal-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    overflow: hidden;
    padding: 22px 24px;
    border-bottom: 1px solid rgba(255, 255, 255, .20);
    background:
        radial-gradient(circle at 92% -20%, rgba(255, 255, 255, .14), transparent 32%),
        linear-gradient(135deg, #8bc83f 0%, #7fc037 58%, #69a92a 100%);
}

.status-modal-header::after {
    content: "";
    position: absolute;
    right: -70px;
    bottom: -115px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
    pointer-events: none;
}

.status-modal-title-wrap,
.status-modal-close-btn {
    position: relative;
    z-index: 2;
}

.status-modal-title-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
}

.status-modal-icon {
    display: grid;
    width: 52px;
    height: 52px;
    flex: 0 0 auto;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .30);
    border-radius: 17px;
    color: #fff;
    background: rgba(255, 255, 255, .16);
    box-shadow: 0 10px 22px rgba(67, 101, 31, .16);
    font-size: 19px;
    backdrop-filter: blur(10px);
}

.status-modal-eyebrow {
    display: block;
    margin-bottom: 5px;
    color: rgba(255, 255, 255, .76);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.status-modal-header h2 {
    margin: 0;
    color: #fff;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -.035em;
}

.status-modal-header p {
    margin: 6px 0 0;
    color: rgba(255, 255, 255, .82);
    font-size: 10px;
    font-weight: 400;
    line-height: 1.5;
}

.status-modal-close-btn {
    display: grid;
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .42);
    border-radius: 13px;
    color: #5f7d42;
    background: rgba(255, 255, 255, .95);
    transition: .2s ease;
}

.status-modal-close-btn:hover {
    color: #fff;
    border-color: #ef6a6a;
    background: #ef6a6a;
    transform: translateY(-1px);
}

.status-modal-form {
    background:
        radial-gradient(circle at 0 0, rgba(139, 200, 63, .07), transparent 25%),
        #fbfdf9;
}

.status-modal-content {
    padding: 22px;
}

.status-info-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 15px;
    border: 1px solid var(--status-border);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 9px 22px rgba(49, 70, 36, .045);
}

.status-info-icon {
    display: grid;
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    place-items: center;
    border-radius: 12px;
    color: var(--status-green-dark);
    background: var(--status-green-soft);
}

.status-info-card strong {
    display: block;
    color: #35412f;
    font-size: 11px;
    font-weight: 600;
}

.status-info-card p {
    margin: 4px 0 0;
    color: #8d9788;
    font-size: 9px;
    font-weight: 400;
    line-height: 1.5;
}

.status-field-group {
    margin-top: 18px;
}

.status-field-group > label {
    display: block;
    margin-bottom: 8px;
    color: #5f6d58;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
}

.status-select-wrap {
    position: relative;
}

.status-select-leading-icon {
    position: absolute;
    top: 50%;
    left: 15px;
    z-index: 2;
    color: var(--status-green-dark);
    font-size: 13px;
    transform: translateY(-50%);
    pointer-events: none;
}

.status-select {
    width: 100%;
    height: 52px;
    padding: 0 48px 0 43px;
    border: 1px solid #d7e3d0;
    border-radius: 14px;
    outline: none;
    color: #3f4d38;
    background:
        linear-gradient(180deg, #fff 0%, #fbfdf9 100%);
    box-shadow:
        0 7px 18px rgba(49, 70, 36, .045),
        inset 0 1px 0 rgba(255, 255, 255, .85);
    font-size: 11px;
    font-weight: 600;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: .2s ease;
}

.status-select:hover {
    border-color: #bdd5aa;
    background: #fff;
}

.status-select:focus {
    border-color: var(--status-green);
    box-shadow:
        0 0 0 4px rgba(139, 200, 63, .13),
        0 8px 20px rgba(49, 70, 36, .06);
}

.status-select option {
    color: #34412e;
    background: #fff;
    font-size: 11px;
    font-weight: 500;
}

.status-select-arrow {
    position: absolute;
    top: 50%;
    right: 14px;
    display: grid;
    width: 27px;
    height: 27px;
    place-items: center;
    border-radius: 9px;
    color: var(--status-green-dark);
    background: var(--status-green-soft);
    font-size: 9px;
    transform: translateY(-50%);
    pointer-events: none;
}

.status-field-help {
    margin: 8px 0 0;
    color: #929c8d;
    font-size: 9px;
    font-weight: 400;
}

.status-modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 17px 22px 20px;
    border-top: 1px solid #e4ebdf;
    background: rgba(255, 255, 255, .78);
}

.status-cancel-btn,
.status-update-btn {
    display: inline-flex;
    min-height: 43px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 18px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    transition: .2s ease;
}

.status-cancel-btn {
    color: #65705f;
    border: 1px solid #dbe4d5;
    background: #fff;
}

.status-cancel-btn:hover {
    background: #f4f7f1;
}

.status-update-btn {
    color: #fff;
    border: 0;
    background: linear-gradient(145deg, #90ca47, #70aa30);
    box-shadow: 0 8px 18px rgba(104, 156, 45, .20);
}

.status-update-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 11px 22px rgba(104, 156, 45, .25);
}

@keyframes statusModalIn {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 560px) {
    #statusModal {
        padding: 0;
    }

    .status-modal-card {
        width: 100%;
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
    }

    .status-modal-header {
        padding: 18px;
    }

    .status-modal-icon {
        width: 47px;
        height: 47px;
        border-radius: 15px;
    }

    .status-modal-header h2 {
        font-size: 20px;
    }

    .status-modal-content {
        padding: 18px;
    }

    .status-modal-footer {
        flex-direction: column-reverse;
        padding: 16px 18px 20px;
    }

    .status-cancel-btn,
    .status-update-btn {
        width: 100%;
    }
}
</style>
