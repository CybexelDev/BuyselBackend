<!-- ================================================= -->
<!-- ADD AGENT PROPERTY MODAL -->
<!-- ================================================= -->

<div id="addPropertyModal" class="fixed inset-0 z-[9999] hidden agent-add-modal">


    <!-- Overlay -->

    <div class="absolute inset-0 bg-black/60 agent-add-overlay" onclick="closeAddPropertyModal()">
    </div>



    <!-- Modal Wrapper -->

    <div class="relative flex items-center justify-center w-full h-full p-3 agent-add-shell">


        <div
            class="bg-white w-full max-w-6xl h-[94vh] rounded-2xl shadow-xl flex flex-col overflow-hidden agent-add-card">



            <!-- Header -->

            <div class="flex justify-between items-center px-5 py-3 border-b agent-add-header">

                <div>

                    <h2 class="text-xl font-bold text-gray-800">
                        Add Property
                    </h2>

                    <p class="text-xs text-gray-500">
                        Create new property listing
                    </p>

                </div>


                <button type="button" onclick="closeAddPropertyModal()"
                    class="h-9 w-9 rounded-lg bg-gray-100 hover:bg-red-500 hover:text-white">

                    <i class="fa-solid fa-xmark"></i>

                </button>


            </div>





            <!-- Body -->


            <div class="flex-1 overflow-y-auto bg-gray-50 p-4 agent-add-body">


                <form id="agentPropertyForm" method="POST" action="{% url 'add_agent_property' %}"
                    enctype="multipart/form-data" class="space-y-4 agent-add-form">


                    {% csrf_token %}






                    <!-- ================================================= -->
                    <!-- CATEGORY SECTION -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Property Category
                        </h3>


                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">



                            <!-- Category -->


                            <div>


                                <label class="label">
                                    Category *
                                </label>


                                <select name="category" id="agentCategorySelect" class="input w-full" required>


                                    <option value="">
                                        Select Category
                                    </option>


                                    {% for category in categories %}

                                    <option value="{{category.id}}">
                                        {{category.name}}
                                    </option>


                                    {% endfor %}


                                </select>


                            </div>





                            <!-- Subcategory -->


                            <div>


                                <label class="label">
                                    Subcategory
                                </label>


                                <select name="subcategory" id="agentSubcategorySelect" class="input w-full">


                                    <option value="">
                                        Select Subcategory
                                    </option>


                                </select>


                            </div>






                            <!-- Purpose -->


                            <div>


                                <label class="label">
                                    Purpose *
                                </label>


                                <select name="purpose" class="input w-full" required>


                                    <option value="">
                                        Select Purpose
                                    </option>


                                    {% for purpose in purposes %}

                                    <option value="{{purpose.id}}">
                                        {{purpose.name}}
                                    </option>


                                    {% endfor %}


                                </select>


                            </div>




                        </div>


                    </div>






                    <!-- ================================================= -->
                    <!-- DYNAMIC FIELDS -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Dynamic Fields
                        </h3>



                        <div id="agentDynamicFieldsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-3">


                        </div>


                    </div>








                    <!-- ================================================= -->
                    <!-- BASIC DETAILS -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Basic Details
                        </h3>



                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">



                            <div>

                                <label class="label">
                                    Label *
                                </label>

                                <input type="text" name="label" class="input w-full" required>

                            </div>





                            <div>

                                <label class="label">
                                    Land Area
                                </label>

                                <input name="land_area" class="input w-full" required>

                            </div>





                            <div>

                                <label class="label">
                                    Square Feet
                                </label>


                                <input type="number" name="sq_ft" class="input w-full">

                            </div>



                        </div>


                    </div>







                    <!-- ================================================= -->
                    <!-- PRICE -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Price Details
                        </h3>



                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">



                            <div>

                                <label class="label">
                                    Price *
                                </label>


                                <input name="price" class="input w-full" required>

                            </div>



                            <div>

                                <label class="label">
                                    Per Price
                                </label>


                                <input name="perprice" class="input w-full">

                            </div>



                            <div>

                                <label class="label">
                                    Deposit
                                </label>


                                <input name="deposit" class="input w-full">

                            </div>



                        </div>


                    </div>


                    <!-- ================================================= -->
                    <!-- DESCRIPTION -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <label class="label">
                            Description *
                        </label>


                        <textarea name="description" class="input w-full h-24" required></textarea>


                    </div>



                    <!-- ================================================= -->
                    <!-- IMAGES ONLY -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Property Images
                        </h3>



                        <input type="file" name="images" id="imageInput" multiple accept="image/*" class="input w-full">



                        <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-3">

                        </div>


                    </div>

                    <!-- ================================================= -->
                    <!-- AMENITIES -->
                    <!-- ================================================= -->

                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Amenities
                        </h3>


                        <input type="text" id="amenities_display" class="input w-full cursor-pointer"
                            placeholder="Select Amenities" readonly onclick="openAmenityModal()">


                        <div id="amenities_hidden"></div>


                    </div>







                    <!-- ================================================= -->
                    <!-- AMENITY MODAL -->
                    <!-- ================================================= -->


                    <div id="amenityModal" class="fixed inset-0 z-[10000] hidden items-center justify-center">


                        <div class="absolute inset-0 bg-black/50" onclick="closeAmenityModal()">
                        </div>



                        <div
                            class="relative bg-white rounded-xl w-[95%] max-w-3xl max-h-[80vh] overflow-hidden shadow-xl">


                            <div class="flex justify-between items-center px-5 py-3 border-b">


                                <h3 class="font-bold">
                                    Select Amenities
                                </h3>


                                <button type="button" onclick="closeAmenityModal()"
                                    class="h-8 w-8 rounded-lg hover:bg-red-500 hover:text-white">


                                    <i class="fa-solid fa-xmark"></i>


                                </button>


                            </div>





                            <div class="p-4 overflow-y-auto">


                                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">


                                    {% for amenity in amenities %}


                                    <button type="button"
                                        class="amenityBtn border rounded-lg p-2 text-sm hover:bg-lime-500 hover:text-white"
                                        data-id="{{amenity.id}}" onclick="toggleAmenity(this)">


                                        {{amenity.name}}


                                    </button>


                                    {% endfor %}



                                </div>


                            </div>





                            <div class="border-t p-3 flex justify-end">


                                <button type="button" onclick="applyAmenities()"
                                    class="px-5 py-2 bg-lime-500 text-white rounded-lg">


                                    Apply


                                </button>


                            </div>


                        </div>


                    </div>









                    <!-- ================================================= -->
                    <!-- OWNER + OPTIONAL AGENT -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Owner Details
                        </h3>



                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">





                            <!-- Optional Agent -->


                            <div>


                                <label class="label">
                                    Agent (Optional)
                                </label>


                                <select name="agent" id="agentSelect" class="input w-full">


                                    <option value="">
                                        No Agent
                                    </option>



                                    {% for agent in agents %}


                                    <option value="{{agent.id}}">

                                        {{agent.username}}

                                    </option>


                                    {% endfor %}


                                </select>


                            </div>







                            <!-- Owner Name -->


                            <div>


                                <label class="label">
                                    Owner Name
                                </label>


                                <input type="text" name="owner" class="input w-full" placeholder="Owner Name">


                            </div>







                            <!-- Phone -->


                            <div>


                                <label class="label">
                                    Phone *
                                </label>


                                <input type="text" name="phone" class="input w-full" required
                                    placeholder="Phone Number">


                            </div>







                            <!-- Whatsapp -->


                            <div>


                                <label class="label">
                                    WhatsApp *
                                </label>


                                <input type="text" name="whatsapp" class="input w-full" required
                                    placeholder="WhatsApp Number">


                            </div>



                        </div>


                    </div>


                    <!-- ================================================= -->
                    <!-- LOCATION -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Location Details
                        </h3>




                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">



                            <div>

                                <label class="label">
                                    City *
                                </label>


                                <input name="city" class="input w-full" required>

                            </div>





                            <div>

                                <label class="label">
                                    District *
                                </label>


                                <input name="district" class="input w-full" required>

                            </div>





                            <div>

                                <label class="label">
                                    State *
                                </label>


                                <input name="state" class="input w-full" required>

                            </div>





                            <div>

                                <label class="label">
                                    Taluk
                                </label>


                                <input name="taluk" class="input w-full">

                            </div>





                            <div>

                                <label class="label">
                                    Village
                                </label>


                                <input name="village" class="input w-full">

                            </div>





                            <div>

                                <label class="label">
                                    Pincode *
                                </label>


                                <input name="pincode" class="input w-full" required>

                            </div>



                        </div>


                    </div>









                    <!-- ================================================= -->
                    <!-- GOOGLE LOCATION -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <label class="label">
                            Google Location
                        </label>


                        <input name="location" class="input w-full" placeholder="Google Map URL" required>


                    </div>









                    <!-- ================================================= -->
                    <!-- NOTES -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <label class="label">
                            Notes
                        </label>


                        <textarea name="notes" class="input w-full h-20" placeholder="Additional notes"></textarea>


                    </div>









                    <!-- ================================================= -->
                    <!-- PAID FEATURED -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <h3 class="font-semibold text-base mb-3">
                            Property Status
                        </h3>


                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">



                            <label class="flex justify-between items-center border rounded-lg p-3">


                                <span>
                                    Featured Property
                                </span>


                                <input type="checkbox" name="is_featured" class="w-5 h-5">


                            </label>





                            <label class="flex justify-between items-center border rounded-lg p-3">


                                <span>
                                    Paid Property
                                </span>


                                <input type="checkbox" name="paid" class="w-5 h-5">


                            </label>



                        </div>


                    </div>









                    <!-- ================================================= -->
                    <!-- SELLING POINTS -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <div class="flex justify-between items-center mb-3">


                            <h3 class="font-semibold">
                                Selling Points
                            </h3>



                            <button type="button" onclick="addKeyPoint()"
                                class="px-3 py-1 rounded-lg bg-lime-500 text-white">


                                <i class="fa fa-plus"></i>


                            </button>


                        </div>



                        <div id="keyPointsContainer" class="space-y-2">


                        </div>


                    </div>









                    <!-- ================================================= -->
                    <!-- LANDMARKS -->
                    <!-- ================================================= -->


                    <div class="bg-white border rounded-xl p-4">


                        <div class="flex justify-between items-center mb-3">


                            <h3 class="font-semibold">
                                Landmarks
                            </h3>



                            <button type="button" onclick="addLandmark()"
                                class="px-3 py-1 rounded-lg bg-lime-500 text-white">


                                <i class="fa fa-plus"></i>


                            </button>



                        </div>



                        <div id="landmarkContainer" class="space-y-2">


                        </div>


                    </div>









                    <!-- ================================================= -->
                    <!-- SUBMIT FOOTER -->
                    <!-- ================================================= -->


                    <div class="sticky bottom-0 bg-white border-t px-5 py-3 agent-add-footer">


                        <div class="flex justify-end gap-3">



                            <button type="button" onclick="closeAddPropertyModal()" class="px-5 py-2 rounded-lg border">


                                Cancel


                            </button>





                            <button type="submit" class="px-7 py-2 rounded-lg bg-lime-500 text-white font-semibold">


                                <i class="fa fa-plus mr-1"></i>

                                Add Property


                            </button>



                        </div>


                    </div>





                </form>


            </div>


        </div>
    </div>

</div>


<style>
    /* =========================================================
   ADD AGENT PROPERTY MODAL — FULL PROFESSIONAL REDESIGN
========================================================= */
    :root {
        --ap-green: #8bc83f;
        --ap-green-dark: #659d28;
        --ap-green-soft: #f2f9e8;
        --ap-border: #dce8d2;
        --ap-text: #283326;
        --ap-muted: #7d8877;
        --ap-danger: #ef5b5b;
    }

    .agent-add-modal {
        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        color: var(--ap-text);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
    }

    .agent-add-overlay {
        background: rgba(18, 28, 14, .64) !important;
        backdrop-filter: blur(8px);
    }

    .agent-add-shell {
        padding: 16px !important;
    }

    .agent-add-card {
        width: min(96vw, 1180px) !important;
        height: min(94vh, 920px) !important;
        border: 1px solid rgba(139, 200, 63, .20);
        border-radius: 26px !important;
        background:
            radial-gradient(circle at 95% 0%, rgba(139, 200, 63, .08), transparent 23%),
            #fff;
        box-shadow:
            0 34px 100px rgba(28, 44, 20, .34),
            inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .agent-add-header {
        position: relative;
        z-index: 5;
        flex: 0 0 auto;
        min-height: 82px;
        padding: 17px 22px !important;
        border-bottom: 1px solid #e4ecdf !important;
        background:
            radial-gradient(circle at 90% 0%, rgba(139, 200, 63, .14), transparent 32%),
            linear-gradient(180deg, #fff, #fbfdf9);
    }

    .agent-add-header>div:first-child {
        display: flex;
        align-items: center;
        gap: 13px;
    }

    .agent-add-header>div:first-child::before {
        content: "\f1ad";
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid #cfe4bb;
        border-radius: 13px;
        color: #5e9f30;
        background: #eef8e6;
        font-family: "Font Awesome 6 Free";
        font-size: 16px;
        font-weight: 900;
    }

    .agent-add-header h2 {
        margin: 0;
        color: #2e3b29 !important;
        font-size: 19px !important;
        font-weight: 700 !important;
        letter-spacing: -.02em;
    }

    .agent-add-header p {
        margin: 4px 0 0;
        color: #879181 !important;
        font-size: 11px !important;
    }

    .agent-add-header>button {
        display: grid !important;
        width: 38px !important;
        height: 38px !important;
        place-items: center !important;
        border: 1px solid #dfe7da !important;
        border-radius: 11px !important;
        color: #7c8877 !important;
        background: #fff !important;
        transition: .18s ease;
    }

    .agent-add-header>button:hover {
        color: #fff !important;
        border-color: var(--ap-danger) !important;
        background: var(--ap-danger) !important;
        transform: rotate(3deg);
    }

    .agent-add-body {
        min-height: 0;
        padding: 18px !important;
        background:
            radial-gradient(circle at 8% 0%, rgba(139, 200, 63, .06), transparent 20%),
            linear-gradient(180deg, #f8fbf5, #f5f8f2) !important;
        scrollbar-width: thin;
        scrollbar-color: #9eb88a transparent;
    }

    .agent-add-body::-webkit-scrollbar {
        width: 9px;
    }

    .agent-add-body::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 999px;
        background: #9eb88a;
        background-clip: padding-box;
    }

    .agent-add-form {
        display: grid;
        gap: 14px !important;
    }

    /* All section cards inside main form */
    .agent-add-form>div:not(.agent-add-footer) {
        position: relative;
        overflow: hidden;
        padding: 17px !important;
        border: 1px solid var(--ap-border) !important;
        border-radius: 17px !important;
        background: #fff !important;
        box-shadow:
            0 9px 22px rgba(49, 70, 36, .055),
            inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .agent-add-form>div:not(.agent-add-footer)::before {
        content: "";
        position: absolute;
        top: 0;
        left: 18px;
        width: 62px;
        height: 3px;
        border-radius: 0 0 999px 999px;
        background: linear-gradient(90deg, var(--ap-green), #b4df75);
    }

    .agent-add-form h3,
    .agent-add-form>div>h3 {
        margin: 0 0 13px !important;
        color: #34412f !important;
        font-size: 14px !important;
        font-weight: 700 !important;
    }

    .agent-add-form h3::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--ap-green);
        box-shadow: 0 0 0 4px rgba(139, 200, 63, .11);
        vertical-align: middle;
    }

    .agent-add-form .label,
    .agent-add-form label.label,
    .agent-add-form label:not(.flex) {
        display: block;
        margin-bottom: 7px;
        color: #596553;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .01em;
    }

    .agent-add-form .input,
    .agent-add-form input[type="text"],
    .agent-add-form input[type="number"],
    .agent-add-form input[type="url"],
    .agent-add-form input[type="file"],
    .agent-add-form select,
    .agent-add-form textarea {
        width: 100%;
        min-height: 46px;
        padding: 11px 13px;
        border: 1px solid #d8e5cf !important;
        border-radius: 12px !important;
        color: #35412f;
        background: #fbfdf9 !important;
        font-size: 12px;
        font-weight: 400;
        outline: none;
        transition:
            border-color .18s ease,
            box-shadow .18s ease,
            background-color .18s ease;
    }

    .agent-add-form textarea {
        min-height: 95px;
        resize: vertical;
    }

    .agent-add-form input::placeholder,
    .agent-add-form textarea::placeholder {
        color: #a0a99c;
    }

    .agent-add-form .input:focus,
    .agent-add-form input:focus,
    .agent-add-form select:focus,
    .agent-add-form textarea:focus {
        border-color: var(--ap-green) !important;
        background: #fff !important;
        box-shadow: 0 0 0 4px rgba(139, 200, 63, .12) !important;
    }

    .agent-add-form select {
        cursor: pointer;
    }

    .agent-add-form input[type="checkbox"] {
        accent-color: var(--ap-green);
    }

    /* Status toggle cards */
    .agent-add-form label.flex.justify-between {
        min-height: 58px;
        padding: 13px 15px !important;
        border: 1px solid #dde8d5 !important;
        border-radius: 13px !important;
        background: #fbfdf9;
        color: #4d5948;
        font-size: 12px;
        font-weight: 600;
        transition: .18s ease;
    }

    .agent-add-form label.flex.justify-between:hover {
        border-color: #c8dfb5 !important;
        background: #f5faef;
    }

    /* Image upload + preview */
    #imageInput {
        padding: 10px !important;
        border-style: dashed !important;
        cursor: pointer;
    }

    #imagePreview>div {
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 6px 14px rgba(49, 70, 36, .08);
    }

    #imagePreview img {
        height: 105px !important;
        border: 1px solid #dbe6d4 !important;
        border-radius: 12px !important;
    }

    /* Amenities */
    #amenities_display {
        padding-right: 42px !important;
        background:
            linear-gradient(90deg, #fbfdf9, #f5faef) !important;
    }

    .amenityBtn {
        min-height: 40px;
        border: 1px solid #dbe7d3 !important;
        border-radius: 11px !important;
        color: #586653;
        background: #fbfdf9;
        font-weight: 600;
        transition: .18s ease;
    }

    .amenityBtn:hover,
    .amenityBtn.bg-lime-500 {
        color: #fff !important;
        border-color: var(--ap-green) !important;
        background: var(--ap-green) !important;
    }

    /* Amenity modal redesign */
    #amenityModal>.absolute {
        background: rgba(17, 25, 14, .58) !important;
        backdrop-filter: blur(6px);
    }

    #amenityModal>.relative {
        overflow: hidden;
        border: 1px solid #dce8d2;
        border-radius: 19px !important;
        box-shadow: 0 28px 80px rgba(31, 47, 22, .30);
    }

    #amenityModal>.relative>div:first-child {
        background:
            radial-gradient(circle at 90% 0%, rgba(139, 200, 63, .14), transparent 30%),
            linear-gradient(180deg, #fff, #fbfdf9);
    }

    #amenityModal h3 {
        color: #33402e;
    }

    #amenityModal .border-t button {
        border-radius: 10px !important;
        background: linear-gradient(145deg, #93cf49, #70aa30) !important;
        box-shadow: 0 8px 18px rgba(105, 158, 46, .20);
    }

    /* Dynamic field cards */
    #agentDynamicFieldsContainer>div {
        border: 1px solid #deead6 !important;
        border-radius: 13px !important;
        background: #fbfdf9 !important;
        box-shadow: none !important;
    }

    /* Add row buttons */
    .agent-add-form button[onclick="addKeyPoint()"],
    .agent-add-form button[onclick="addLandmark()"] {
        display: inline-grid;
        width: 34px;
        height: 34px;
        padding: 0 !important;
        place-items: center;
        border-radius: 10px !important;
        color: #fff;
        background: linear-gradient(145deg, #93cf49, #70aa30) !important;
        box-shadow: 0 7px 14px rgba(105, 158, 46, .18);
    }

    #keyPointsContainer>div,
    #landmarkContainer>div {
        align-items: center;
    }

    #keyPointsContainer button,
    #landmarkContainer button {
        min-height: 44px;
        border-radius: 11px !important;
        background: #fff1f1 !important;
        color: #ed5757 !important;
        border: 1px solid #f2c4c4 !important;
    }

        display: inline-flex;
        min-height: 42px;
        align-items: center;

        border: 0;

        color: #fff;
        background: linear-gradient(145deg, #95cf4d, #70aa30) !important;

    }

    /* Responsive */
    @media (max-width: 900px) {

            height: calc(100dvh - 20px) !important;

            margin: 0 -13px -13px !important;

    }

            padding: 0 !important;
        }

        .agent-add-card {
            width: 100% !important;
            height: 100dvh !important;
            border-radius: 0 !important;

        .agent-add-header>div:first-child::before {
            width: 39px;
            height: 39px;

            font-size: 17px !important;

        .agent-add-footer>div {

            grid-template-columns: 1fr 1fr;

        .agent-add-footer button {

</style>


<script>

    /* ==========================================
    ADD PROPERTY MODAL
    ========================================== */

    function openAddPropertyModal() {

        const modal = document.getElementById("addPropertyModal");

        if (modal) {
            modal.classList.remove("hidden");
            document.body.classList.add("overflow-hidden");
        }

    }

    function closeAddPropertyModal() {

        const modal = document.getElementById("addPropertyModal");

        if (modal) {
            modal.classList.add("hidden");
            document.body.classList.remove("overflow-hidden");
        }

    }


    /* ==========================================
    INITIALIZE
    ========================================== */

    document.addEventListener("DOMContentLoaded", function () {

        initializeCategoryDropdown();
        initializeSubcategoryDropdown();

    });


    /* ==========================================
    CATEGORY CHANGE
    ========================================== */

    function initializeCategoryDropdown() {

        const category = document.getElementById("agentCategorySelect");

        if (!category) {
            return;
        }

        category.addEventListener("change", function () {

            const categoryId = this.value;

            clearSubcategory();
            clearDynamicFields();

            if (categoryId) {
                loadSubcategories(categoryId);
            }

        });

    }


    /* ==========================================
    SUBCATEGORY CHANGE
    ========================================== */

    function initializeSubcategoryDropdown() {

        const subcategory = document.getElementById("agentSubcategorySelect");

        if (!subcategory) {
            return;
        }

        subcategory.addEventListener("change", function () {

            const subcategoryId = this.value;

            clearDynamicFields();

            if (subcategoryId) {
                loadDynamicFields(subcategoryId);
            }

        });

    }


    /* ==========================================
    LOAD SUBCATEGORIES
    ========================================== */

    function loadSubcategories(categoryId) {

        fetch(`/admin_panel/get-subcategories/${categoryId}/`)

            .then(function (response) {

                if (!response.ok) {
                    throw new Error("Unable to load subcategories");
                }

                return response.json();

            })

            .then(function (data) {

                const select = document.getElementById("agentSubcategorySelect");

                if (!select) {
                    return;
                }

                select.innerHTML =
                    `
        <option value="">
            Select Subcategory
        </option>
        `;

                data.forEach(function (item) {

                    select.innerHTML +=
                        `
            <option value="${item.id}">
                ${item.name}
            </option>
            `;

                });

            })

            .catch(function (error) {

                console.error(error);

            });

    }


    /* ==========================================
    LOAD DYNAMIC FIELDS
    ========================================== */

    const dynamicContainer = document.getElementById("agentDynamicFieldsContainer");

    const subcategorySelect = document.getElementById("agentSubcategorySelect");

    if (subcategorySelect) {

        subcategorySelect.addEventListener("change", function () {

            const subId = this.value;

            if (!subId) {

                dynamicContainer.innerHTML = "";

                return;

            }

            dynamicContainer.innerHTML = "<p class='text-gray-500'>Loading...</p>";

            let url = "/admin_panel/get-subcategory-fields/0/";

            url = url.replace("0", subId);

            fetch(url)

                .then(res => res.json())

                .then(fields => {

                    dynamicContainer.innerHTML = "";

                    if (!fields.length) {

                        dynamicContainer.innerHTML =
                            "<p class='text-gray-500'>No fields available.</p>";

                        return;

                    }

                    fields.forEach(field => {

                        let html = "";

                        if (field.type === "text") {

                            html = `
                    <input
                        type="text"
                        name="field_${field.id}"
                        class="input w-full"
                        placeholder="Enter ${field.name}">
                    `;

                        }

                        else if (field.type === "number") {

                            html = `
                    <input
                        type="number"
                        name="field_${field.id}"
                        class="input w-full"
                        placeholder="Enter ${field.name}">
                    `;

                        }

                        else if (field.type === "countable") {

                            html = `
                    <input
                        type="number"
                        min="0"
                        name="field_${field.id}"
                        class="input w-full"
                        placeholder="0">
                    `;

                        }

                        else if (field.type === "boolean") {

                            html = `
                    <label class="flex items-center gap-2">

                        <input
                            type="checkbox"
                            name="field_${field.id}"
                            value="Yes">

                        Yes

                    </label>
                    `;

                        }

                        else if (field.type === "select") {

                            let options = `<option value="">Select</option>`;

                            field.options.forEach(option => {

                                options += `
                        <option value="${option.name}">
                            ${option.name}
                        </option>
                        `;

                            });

                            html = `
                    <select
                        name="field_${field.id}"
                        class="input w-full">

                        ${options}

                    </select>
                    `;

                        }

                        else if (field.type === "multi_select") {

                            let rows = "";

                            field.options.forEach(option => {

                                rows += `

                        <div class="flex items-center gap-3 mb-3">

                            <div class="w-10 h-10 rounded-lg border flex items-center justify-center">

                                ${option.icon
                                        ?
                                        `<img src="${option.icon}" class="w-6 h-6 object-contain">`
                                        :
                                        `<i class="fa fa-layer-group"></i>`
                                    }

                            </div>

                            <div class="flex-1">

                                ${option.name}

                            </div>

                            <input
                                type="number"
                                min="0"
                                value=""
                                class="multi-count input w-24"
                                data-option="${option.name}">

                        </div>

                        `;

                            });

                            html = `

                    <div>

                        ${rows}

                        <input
                            type="hidden"
                            class="multi-json"
                            name="field_${field.id}">

                    </div>

                    `;

                        }

                        dynamicContainer.innerHTML += `

                <div class="bg-white border rounded-xl p-4">

                    <label class="block font-semibold mb-3">

                        ${field.name}

                    </label>

                    ${html}

                </div>

                `;

                    });

                    document.querySelectorAll(".multi-json").forEach(hidden => {

                        const parent = hidden.parentElement;

                        const inputs = parent.querySelectorAll(".multi-count");

                        function updateJSON() {

                            const values = [];

                            inputs.forEach(input => {

                                if (input.value !== "") {

                                    values.push({

                                        option: input.dataset.option,

                                        value: input.value

                                    });

                                }

                            });

                            hidden.value = JSON.stringify(values);

                        }

                        inputs.forEach(input => {

                            input.addEventListener("input", updateJSON);

                        });

                    });

                })

                .catch(error => {

                    console.error(error);

                    dynamicContainer.innerHTML =
                        "<p class='text-red-500'>Unable to load fields.</p>";

                });

        });

    }

    /* ==========================================
    HELPERS
    ========================================== */

    function clearSubcategory() {

        const select = document.getElementById("agentSubcategorySelect");

        if (select) {

            select.innerHTML =
                `
        <option value="">
            Select Subcategory
        </option>
        `;

        }

    }

    function clearDynamicFields() {

        const container = document.getElementById("agentDynamicFieldsContainer");

        if (container) {
            container.innerHTML = "";
        }

    }

    /*==========================================
    AMENITIES
    ==========================================*/

    let selectedAmenities = [];

    function openAmenityModal() {

        const modal = document.getElementById("amenityModal");

        if (!modal) return;

        modal.classList.remove("hidden");
        modal.classList.add("flex");

    }

    function closeAmenityModal() {

        const modal = document.getElementById("amenityModal");

        if (!modal) return;

        modal.classList.add("hidden");
        modal.classList.remove("flex");

    }

    function toggleAmenity(button) {

        const id = button.dataset.id;

        if (selectedAmenities.includes(id)) {

            selectedAmenities = selectedAmenities.filter(item => item !== id);

            button.classList.remove("bg-lime-500");
            button.classList.remove("text-white");

        } else {

            selectedAmenities.push(id);

            button.classList.add("bg-lime-500");
            button.classList.add("text-white");

        }

    }

    function applyAmenities() {

        const hidden = document.getElementById("amenities_hidden");
        const display = document.getElementById("amenities_display");

        if (!hidden || !display) return;

        hidden.innerHTML = "";

        selectedAmenities.forEach(id => {

            hidden.innerHTML += `
        <input
            type="hidden"
            name="amenities"
            value="${id}">
        `;

        });

        const names = [];

        document.querySelectorAll(".amenityBtn.bg-lime-500").forEach(btn => {
            names.push(btn.innerText.trim());
        });

        display.value = names.join(", ");

        closeAmenityModal();

    }



    /*==========================================
    IMAGE PREVIEW
    ==========================================*/

    document.addEventListener("DOMContentLoaded", function () {

        const imageInput = document.getElementById("imageInput");

        if (!imageInput) return;

        imageInput.addEventListener("change", function () {

            const preview = document.getElementById("imagePreview");

            if (!preview) return;

            preview.innerHTML = "";

            Array.from(this.files).forEach(file => {

                if (!file.type.startsWith("image/")) return;

                const reader = new FileReader();

                reader.onload = function (e) {

                    preview.innerHTML += `
                <div class="relative">

                    <img
                        src="${e.target.result}"
                        class="h-28 w-full rounded-xl border object-cover">

                </div>
                `;

                };

                reader.readAsDataURL(file);

            });

        });

    });



    /*==========================================
    SELLING POINTS
    ==========================================*/

    function addKeyPoint() {

        const container = document.getElementById("keyPointsContainer");

        if (!container) return;

        container.insertAdjacentHTML("beforeend", `

    <div class="flex gap-2">

        <input
            type="text"
            name="selling_points"
            class="input flex-1"
            placeholder="Selling Point">

        <button
            type="button"
            class="px-4 rounded-xl bg-red-500 text-white"
            onclick="removeRow(this)">

            <i class="fa-solid fa-trash"></i>

        </button>

    </div>

    `);

    }



    /*==========================================
    LANDMARKS
    ==========================================*/

    function addLandmark() {

        const container = document.getElementById("landmarkContainer");

        if (!container) return;

        container.insertAdjacentHTML("beforeend", `

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

        <input
            type="text"
            name="landmark_name"
            class="input"
            placeholder="Landmark">

        <input
            type="text"
            name="landmark_distance"
            class="input"
            placeholder="Distance">

        <button
            type="button"
            class="rounded-xl bg-red-500 text-white"
            onclick="removeRow(this)">

            Remove

        </button>

    </div>

    `);

    }



    /*==========================================
    REMOVE ROW
    ==========================================*/

    function removeRow(button) {

        const row = button.parentElement;

        if (row) {

            row.remove();

        }

    }



    /*==========================================
    FORM SUBMIT
    ==========================================*/

    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("agentPropertyForm");

        if (!form) return;

        form.addEventListener("submit", function () {

            const submit = this.querySelector("button[type='submit']");

            if (!submit) return;

            submit.disabled = true;

            submit.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin mr-2"></i>
        Saving...
        `;

        });

    });



    /*==========================================
    INITIAL VALUES
    ==========================================*/

    document.addEventListener("DOMContentLoaded", function () {

        if (document.getElementById("keyPointsContainer")) {

            addKeyPoint();

        }

        if (document.getElementById("landmarkContainer")) {

            addLandmark();

        }

    });



    /*==========================================
    CLICK OUTSIDE AMENITY MODAL
    ==========================================*/

    document.addEventListener("click", function (e) {

        const modal = document.getElementById("amenityModal");

        if (!modal) return;

        if (e.target === modal) {

            closeAmenityModal();

        }

    });



    /*==========================================
    ESC CLOSE
    ==========================================*/

    document.addEventListener("keydown", function (e) {

        if (e.key === "Escape") {

            closeAmenityModal();
            closeAddPropertyModal();

        }

    });



    /*==========================================
    NULL SAFE HELPERS
    ==========================================*/

    function safe(id) {

        return document.getElementById(id);

    }

    function safeHTML(id, html) {

        const el = safe(id);

        if (el) {

            el.innerHTML = html;

        }

    }

    function safeValue(id, value) {

        const el = safe(id);

        if (el) {

            el.value = value;

        }

    }



    /*==========================================
    FINAL CLEANUP
    ==========================================*/

    document.addEventListener("DOMContentLoaded", function () {

        console.log("Add Property Modal Loaded Successfully");

    });

</script>
