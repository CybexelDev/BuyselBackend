<style>
    :root {
        --delete-red: #ef4444;
        --delete-red-dark: #dc2626;
        --delete-red-soft: #fff1f2;
        --delete-border: #fecdd3;
        --delete-text: #292524;
        --delete-muted: #78716c;
    }

    .delete-property-modal {
        background: rgba(20, 20, 18, 0.68);
        backdrop-filter: blur(8px);
    }

    .delete-property-card {
        position: relative;
        width: 100%;
        max-width: 430px;
        overflow: hidden;
        border: 1px solid rgba(239, 68, 68, 0.18);
        border-radius: 24px;
        background: #ffffff;
        box-shadow:
            0 30px 80px rgba(20, 20, 18, 0.3),
            0 8px 25px rgba(20, 20, 18, 0.08);
        animation: deleteModalOpen 0.22s ease-out;
    }

    .delete-property-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(
            90deg,
            #fb7185,
            #ef4444,
            #dc2626
        );
    }

    .delete-property-content {
        padding: 32px 30px 26px;
        text-align: center;
    }

    .delete-property-icon {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        place-items: center;
        border: 1px solid var(--delete-border);
        border-radius: 22px;
        color: var(--delete-red);
        background:
            radial-gradient(
                circle at 30% 20%,
                rgba(255, 255, 255, 0.9),
                transparent 42%
            ),
            var(--delete-red-soft);
        box-shadow:
            0 12px 28px rgba(239, 68, 68, 0.14),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);
        font-size: 25px;
    }

    .delete-property-eyebrow {
        display: block;
        margin-bottom: 8px;
        color: var(--delete-red);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .delete-property-title {
        margin: 0;
        color: var(--delete-text);
        font-size: 25px;
        font-weight: 750;
        line-height: 1.2;
        letter-spacing: -0.035em;
    }

    .delete-property-description {
        max-width: 330px;
        margin: 12px auto 0;
        color: var(--delete-muted);
        font-size: 13px;
        line-height: 1.7;
    }

    .delete-property-warning {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 20px;
        padding: 13px 14px;
        border: 1px solid #fed7d7;
        border-radius: 13px;
        color: #b45353;
        background: #fff8f8;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.55;
        text-align: left;
    }

    .delete-property-warning i {
        margin-top: 2px;
        color: var(--delete-red);
        font-size: 13px;
    }

    .delete-property-footer {
        padding: 16px 18px 18px;
        border-top: 1px solid #f1f1ef;
        background: #fafaf9;
    }

    .delete-property-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
    }

    .delete-property-cancel,
    .delete-property-submit {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 17px;
        border-radius: 13px;
        font-size: 12px;
        font-weight: 700;
        transition: 0.18s ease;
    }

    .delete-property-cancel {
        border: 1px solid #d6d3d1;
        color: #57534e;
        background: #ffffff;
    }

    .delete-property-cancel:hover {
        border-color: #c7c2be;
        background: #f5f5f4;
        transform: translateY(-1px);
    }

    .delete-property-submit {
        border: 1px solid var(--delete-red);
        color: #ffffff;
        background: linear-gradient(
            135deg,
            #f87171,
            #ef4444
        );
        box-shadow: 0 10px 22px rgba(239, 68, 68, 0.2);
    }

    .delete-property-submit:hover {
        border-color: var(--delete-red-dark);
        background: linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );
        transform: translateY(-1px);
        box-shadow: 0 14px 26px rgba(220, 38, 38, 0.24);
    }

    .delete-property-submit:disabled {
        cursor: not-allowed;
        opacity: 0.7;
        transform: none;
        box-shadow: none;
    }

    @keyframes deleteModalOpen {
        from {
            opacity: 0;
            transform: translateY(12px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @media (max-width: 520px) {
        .delete-property-card {
            border-radius: 20px;
        }

        .delete-property-content {
            padding: 27px 20px 22px;
        }

        .delete-property-actions {
            grid-template-columns: 1fr;
        }
    }
</style>


<div
    id="deletePropertyModal"
    class="delete-property-modal fixed inset-0 z-[10000] hidden items-center justify-center px-4"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="deletePropertyTitle"
    onclick="if(event.target === this) closeDeletePropertyModal()">

    <div class="delete-property-card">

        <div class="delete-property-content">

            <div class="delete-property-icon">
                <i class="fa-regular fa-trash-can"></i>
            </div>

            <span class="delete-property-eyebrow">
                Permanent Action
            </span>

            <h2
                id="deletePropertyTitle"
                class="delete-property-title">
                Delete Property
            </h2>

            <p class="delete-property-description">
                Are you sure you want to delete this property?
                This action cannot be undone.
            </p>

            <div class="delete-property-warning">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <span>
                    All property details and related information
                    will be permanently removed.
                </span>

            </div>

        </div>


        <form
            id="deletePropertyForm"
            method="POST"
            class="delete-property-footer">

            {% csrf_token %}

            <input
                type="hidden"
                id="delete_property_id"
                name="property_id">

            <div class="delete-property-actions">

                <button
                    type="button"
                    onclick="closeDeletePropertyModal()"
                    class="delete-property-cancel">

                    Cancel

                </button>

                <button
                    id="deletePropertySubmitBtn"
                    type="submit"
                    class="delete-property-submit">

                    <i class="fa-regular fa-trash-can"></i>
                    Delete Property

                </button>

            </div>

        </form>

    </div>

</div>


<script>
(function () {
    "use strict";

    const deleteUrlTemplate =
        "/admin_panel/agent-properties/delete/__PROPERTY_ID__/";

    function resetDeleteButton() {
        const button = document.getElementById(
            "deletePropertySubmitBtn"
        );

        if (!button) return;

        button.disabled = false;

        button.innerHTML = `
            <i class="fa-regular fa-trash-can"></i>
            Delete Property
        `;
    }

    window.openDeletePropertyModal = function (id) {
        const modal = document.getElementById(
            "deletePropertyModal"
        );

        const form = document.getElementById(
            "deletePropertyForm"
        );

        const input = document.getElementById(
            "delete_property_id"
        );

        if (!modal || !form || !input || !id) {
            return;
        }

        input.value = id;

        form.action = deleteUrlTemplate.replace(
            "__PROPERTY_ID__",
            encodeURIComponent(id)
        );

        resetDeleteButton();

        modal.classList.remove("hidden");
        modal.classList.add("flex");

        modal.setAttribute(
            "aria-hidden",
            "false"
        );

        document.body.classList.add(
            "overflow-hidden"
        );
    };

    window.closeDeletePropertyModal = function () {
        const modal = document.getElementById(
            "deletePropertyModal"
        );

        const form = document.getElementById(
            "deletePropertyForm"
        );

        const input = document.getElementById(
            "delete_property_id"
        );

        if (modal) {
            modal.classList.remove("flex");
            modal.classList.add("hidden");

            modal.setAttribute(
                "aria-hidden",
                "true"
            );
        }

        if (form) {
            form.action = "";
        }

        if (input) {
            input.value = "";
        }

        resetDeleteButton();

        document.body.classList.remove(
            "overflow-hidden"
        );
    };

    document.addEventListener(
        "DOMContentLoaded",
        function () {
            const form = document.getElementById(
                "deletePropertyForm"
            );

            if (!form) return;

            form.addEventListener(
                "submit",
                function () {
                    const button =
                        document.getElementById(
                            "deletePropertySubmitBtn"
                        );

                    if (!button) return;

                    button.disabled = true;

                    button.innerHTML = `
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Deleting...
                    `;
                }
            );
        }
    );

    document.addEventListener(
        "keydown",
        function (event) {
            if (event.key === "Escape") {
                closeDeletePropertyModal();
            }
        }
    );
})();
</script>
