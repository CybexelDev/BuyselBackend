<div
    id="deletePropertyModal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/50 px-4 backdrop-blur-sm"
    onclick="if(event.target===this) closeDeletePropertyModal()">

<div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">


<div class="text-center">


<div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-100">

<i class="fa-solid fa-trash text-2xl text-red-600"></i>

</div>



<h2 class="text-2xl font-bold text-gray-800">

Delete Property

</h2>



<p class="mt-3 text-gray-500">

Are you sure you want to delete this property?

This action cannot be undone.

</p>


</div>





<form
id="deletePropertyForm"
method="POST"
class="mt-8">


{% csrf_token %}


<input
type="hidden"
id="delete_property_id"
name="property_id">





<div class="flex justify-center gap-4">


<button
type="button"
onclick="closeDeletePropertyModal()"
class="rounded-xl border border-gray-300 px-6 py-3 font-semibold text-gray-700 hover:bg-gray-100">

Cancel

</button>




<button
type="submit"
class="rounded-xl bg-red-600 px-6 py-3 font-semibold text-white hover:bg-red-700">


<i class="fa-solid fa-trash mr-2"></i>

Delete

</button>


</div>


</form>


</div>


</div>

function openDeletePropertyModal(id) {

    const modal = document.getElementById("deletePropertyModal");
    const form = document.getElementById("deletePropertyForm");
    const hiddenInput = document.getElementById("delete_property_id");

    hiddenInput.value = id;

    form.action = `/admin_panel/agent-properties/delete/${id}/`;

    modal.classList.remove("hidden");
    modal.classList.add("flex");
}
function closeDeletePropertyModal() {

    const modal = document.getElementById("deletePropertyModal");

    modal.classList.remove("flex");
    modal.classList.add("hidden");

    document.getElementById("delete_property_id").value = "";

    document.getElementById("deletePropertyForm").action = "";
}

document.addEventListener("keydown", function (e) {

    if (e.key === "Escape") {

        closeDeletePropertyModal();

    }

});
document.getElementById("deletePropertyForm")
.addEventListener("submit", function () {

    const btn = this.querySelector('button[type="submit"]');

    btn.disabled = true;

    btn.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin mr-2"></i>
        Deleting...
    `;

});
