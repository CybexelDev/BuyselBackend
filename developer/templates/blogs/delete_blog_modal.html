<!-- ========================================================= -->
<!-- SMALL DELETE BLOG MODAL -->
<!-- templates/blogs/includes/delete_blog_modal.html -->
<!-- ========================================================= -->

<div
    id="deleteBlogModal"
    class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/50 p-4 backdrop-blur-sm"
>

    <div
        class="w-full max-w-[340px] overflow-hidden rounded-2xl bg-white shadow-2xl"
    >

        <!-- Modal Body -->

        <div class="p-5">

            <div class="flex items-start gap-3">

                <!-- Small Delete Icon -->

                <div
                    class="flex h-10 w-10 flex-none items-center justify-center rounded-full bg-red-100 text-red-500"
                >
                    <i class="fa-solid fa-trash-can text-base"></i>
                </div>

                <!-- Content -->

                <div class="min-w-0 flex-1">

                    <h2 class="text-base font-bold text-gray-800">
                        Delete Blog?
                    </h2>

                    <p class="mt-1 text-xs leading-5 text-gray-500">

                        Are you sure you want to delete

                        <span
                            id="deleteBlogTitle"
                            class="break-words font-semibold text-gray-700"
                        ></span>?

                    </p>

                    <p class="mt-1 text-[11px] text-red-500">
                        This action cannot be undone.
                    </p>

                </div>

                <!-- Close Button -->

                <button
                    type="button"
                    id="closeDeleteBlog"
                    aria-label="Close modal"
                    class="flex h-8 w-8 flex-none items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-100 hover:text-gray-600"
                >
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>

            </div>

        </div>

        <!-- Footer -->

        <div
            class="flex items-center justify-end gap-2 border-t border-gray-100 bg-gray-50 px-5 py-3"
        >

            <button
                type="button"
                id="cancelDeleteBlog"
                class="rounded-lg border border-gray-200 bg-white px-4 py-2 text-xs font-semibold text-gray-600 transition hover:bg-gray-100"
            >
                Cancel
            </button>

            <form
                id="deleteBlogForm"
                method="POST"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="rounded-lg bg-red-500 px-4 py-2 text-xs font-semibold text-white transition hover:bg-red-600"
                >
                    Delete
                </button>

            </form>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const deleteModal = document.getElementById("deleteBlogModal");
    const deleteForm = document.getElementById("deleteBlogForm");
    const deleteTitle = document.getElementById("deleteBlogTitle");

    const cancelDeleteButton =
        document.getElementById("cancelDeleteBlog");

    const closeDeleteButton =
        document.getElementById("closeDeleteBlog");

    const deleteButtons =
        document.querySelectorAll(".deleteBlogBtn");

    function openDeleteModal() {

        if (!deleteModal) return;

        deleteModal.classList.remove("hidden");
        deleteModal.classList.add("flex");

        document.body.classList.add("overflow-hidden");

    }

    function closeDeleteModal() {

        if (!deleteModal) return;

        deleteModal.classList.remove("flex");
        deleteModal.classList.add("hidden");

        document.body.classList.remove("overflow-hidden");

    }

    deleteButtons.forEach(function (button) {

        button.addEventListener("click", function () {

            const id = this.dataset.id || "";
            const title = this.dataset.title || "this blog";

            if (deleteTitle) {
                deleteTitle.textContent = `"${title}"`;
            }

            if (deleteForm) {
                deleteForm.action = `/blogs/delete/${id}/`;
            }

            openDeleteModal();

        });

    });

    if (cancelDeleteButton) {
        cancelDeleteButton.addEventListener(
            "click",
            closeDeleteModal
        );
    }

    if (closeDeleteButton) {
        closeDeleteButton.addEventListener(
            "click",
            closeDeleteModal
        );
    }

    if (deleteModal) {

        deleteModal.addEventListener("click", function (event) {

            if (event.target === deleteModal) {
                closeDeleteModal();
            }

        });

    }

    document.addEventListener("keydown", function (event) {

        if (
            event.key === "Escape" &&
            deleteModal &&
            deleteModal.classList.contains("flex")
        ) {
            closeDeleteModal();
        }

    });

    if (deleteForm) {

        deleteForm.addEventListener("submit", function () {

            const submitButton =
                this.querySelector("button[type='submit']");

            if (!submitButton) return;

            submitButton.disabled = true;
            submitButton.classList.add(
                "cursor-not-allowed",
                "opacity-70"
            );

            submitButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Deleting...';

        });

    }

});
</script>
