<!-- ========================================================= -->
<!-- DELETE BLOG MODAL -->
<!-- templates/blogs/includes/delete_blog_modal.html -->
<!-- ========================================================= -->

<div
    id="deleteBlogModal"
    class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">

    <div class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- Header -->

        <div class="bg-gradient-to-r from-red-500 to-rose-600 px-8 py-6">

            <div class="flex items-center gap-4">

                <div class="w-14 h-14 rounded-2xl bg-white/20 flex items-center justify-center">

                    <i class="fa-solid fa-trash text-white text-2xl"></i>

                </div>

                <div>

                    <h2 class="text-2xl font-bold text-white">

                        Delete Blog

                    </h2>

                    <p class="text-red-100 text-sm">

                        This action cannot be undone.

                    </p>

                </div>

            </div>

        </div>

        <!-- Body -->

        <div class="p-8">

            <div class="flex justify-center mb-6">

                <div class="w-24 h-24 rounded-full bg-red-100 flex items-center justify-center">

                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-5xl"></i>

                </div>

            </div>

            <h3 class="text-xl font-bold text-center text-gray-800">

                Are you sure?

            </h3>

            <p class="mt-4 text-center text-gray-500 leading-7">

                You are about to permanently delete

                <span
                    id="deleteBlogTitle"
                    class="font-semibold text-red-600">

                </span>

                from the blog list.

            </p>

        </div>

        <!-- Footer -->

        <div class="border-t bg-gray-50 px-8 py-5 flex justify-end gap-4">

            <button
                type="button"
                id="cancelDeleteBlog"
                class="px-7 py-3 rounded-xl border border-gray-300 hover:bg-gray-100 font-semibold transition">

                Cancel

            </button>

            <form
                id="deleteBlogForm"
                method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="px-8 py-3 rounded-xl bg-gradient-to-r from-red-500 to-rose-600 hover:from-rose-600 hover:to-red-500 text-white font-semibold shadow-lg transition">

                    <i class="fa-solid fa-trash mr-2"></i>

                    Delete Blog

                </button>

            </form>

        </div>

    </div>

</div>

<script>

    /* ===========================================
   DELETE BLOG MODAL
=========================================== */

const deleteModal = document.getElementById("deleteBlogModal");

const deleteForm = document.getElementById("deleteBlogForm");

const deleteTitle = document.getElementById("deleteBlogTitle");

const cancelDelete = document.getElementById("cancelDeleteBlog");


document.querySelectorAll(".deleteBlogBtn").forEach(button => {

    button.addEventListener("click", function () {

        const id = this.dataset.id;

        const title = this.dataset.title;

        deleteTitle.textContent = `"${title}"`;

        deleteForm.action = `/blogs/delete/${id}/`;

        deleteModal.classList.remove("hidden");

        deleteModal.classList.add("flex");

    });

});


function closeDeleteModal() {

    deleteModal.classList.remove("flex");

    deleteModal.classList.add("hidden");

}


document.getElementById("cancelDeleteBlog")
.addEventListener("click", closeDeleteModal);


deleteModal.addEventListener("click", function (e) {

    if (e.target === deleteModal) {

        closeDeleteModal();

    }

});


document.addEventListener("keydown", function (e) {

    if (

        e.key === "Escape" &&

        deleteModal.classList.contains("flex")

    ) {

        closeDeleteModal();

    }

});


deleteForm.addEventListener("submit", function () {

    const btn = this.querySelector("button[type='submit']");

    btn.disabled = true;

    btn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Deleting...';

});
</script>
