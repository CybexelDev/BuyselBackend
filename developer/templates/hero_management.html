<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Images</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

</head>

<body class="bg-gray-100 font-sans h-screen overflow-hidden">

<div class="flex h-screen p-2">

<!-- SIDEBAR -->
<div class="w-72 bg-[#8bc83f] text-white p-7 rounded-l-3xl shadow-xl">

<div class="mb-10">
<h1 class="text-2xl font-bold">Buysel Admin</h1>
</div>

<nav class="space-y-3">

<a href="{% url 'hero_management' %}"
class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white text-black">
<i class="fa-solid fa-image"></i>
Hero Images
</a>

</nav>

</div>

<!-- MAIN CONTENT -->
<div class="flex-1 bg-white rounded-r-3xl shadow-lg flex flex-col">

<!-- HEADER -->
<div class="flex justify-between items-center px-10 py-5 border-b">

<h2 class="text-2xl font-semibold text-gray-700">
Hero Header Images
</h2>

<button onclick="openModal()"
class="bg-[#8bc83f] text-white px-5 py-2 rounded-lg shadow hover:bg-[#79b534]">
+ Add Image
</button>

</div>

<!-- TABLE -->
<div class="p-10 overflow-y-auto">

<div class="bg-white rounded-xl shadow border overflow-hidden">

<table class="w-full text-sm">

<thead class="bg-[#f3faea] text-gray-700 uppercase text-xs">
<tr>
<th class="px-6 py-3 text-left">ID</th>
<th class="px-6 py-3 text-left">Preview</th>
<th class="px-6 py-3 text-left">Status</th>
<th class="px-6 py-3 text-left">Created</th>
<th class="px-6 py-3 text-left">Actions</th>
</tr>
</thead>

<tbody class="divide-y">

{% for hero in heroes %}
<tr class="hover:bg-[#f9fdf3] transition">

<td class="px-6 py-4 font-medium">
{{ hero.id }}
</td>

<td class="px-6 py-4">
<img src="{{ hero.image.url }}"
class="w-40 h-20 object-contain bg-gray-50 rounded border p-2">
</td>

<td class="px-6 py-4">
<span class="px-3 py-1 rounded-full text-xs
{% if hero.is_active %}
bg-green-100 text-green-600
{% else %}
bg-red-100 text-red-600
{% endif %}">
{{ hero.is_active|yesno:"Active,Inactive" }}
</span>
</td>

<td class="px-6 py-4 text-gray-500 text-sm">
{{ hero.created_at|date:"M d, Y" }}
</td>

<td class="px-6 py-4 flex gap-2">

<button onclick="toggleHero('{{ hero.id }}')"
class="px-3 py-1 text-xs bg-yellow-100 text-yellow-600 rounded hover:bg-yellow-200">
Toggle
</button>

<button onclick="deleteHero('{{ hero.id }}')"
class="px-3 py-1 text-xs bg-red-100 text-red-600 rounded hover:bg-red-200">
Delete
</button>

</td>

</tr>

{% empty %}
<tr>
<td colspan="5" class="text-center py-6 text-gray-400">
No hero images found
</td>
</tr>
{% endfor %}

</tbody>

</table>

</div>

</div>

</div>
</div>

<!-- ADD MODAL -->
<div id="modal"
class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">

<div class="bg-white rounded-xl w-[400px] shadow-2xl overflow-hidden">

<div class="flex justify-between items-center px-6 py-4 border-b">
<h3 class="text-lg font-semibold text-gray-800">
Add Hero Image (PNG only)
</h3>

<button onclick="closeModal()" class="text-gray-500 hover:text-red-500">
✕
</button>
</div>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<input type="hidden" name="action" value="add">

<div class="p-6 space-y-4">

<input type="file"
name="image"
accept="image/png"
required
class="w-full border rounded-lg px-3 py-2 text-sm">

<label class="flex items-center gap-2 text-sm">
<input type="checkbox" name="is_active" checked>
Active (multiple allowed)
</label>

</div>

<div class="flex justify-end gap-3 px-6 py-4 border-t bg-gray-50">

<button type="button"
onclick="closeModal()"
class="px-4 py-2 bg-gray-300 rounded">
Cancel
</button>

<button type="submit"
class="px-5 py-2 bg-[#8bc83f] text-white rounded hover:bg-[#79b534]">
Upload
</button>

</div>

</form>

</div>
</div>

<!-- JS -->
<script>

function openModal(){
document.getElementById("modal").classList.remove("hidden")
}

function closeModal(){
document.getElementById("modal").classList.add("hidden")
}

function getCSRF(){
return document.querySelector('[name=csrfmiddlewaretoken]').value
}

function postData(data){

const params = new URLSearchParams();

for(let key in data){
params.append(key, data[key])
}

fetch("", {
method: "POST",
headers: {
"X-CSRFToken": getCSRF()
},
body: params
})
.then(()=>location.reload())
}

// TOGGLE
function toggleHero(id){
postData({
action: "toggle",
hero_id: id
})
}

// DELETE
function deleteHero(id){
if(confirm("Are you sure you want to delete this image?")){
postData({
action: "delete",
hero_id: id
})
}
}

</script>

</body>
</html>
