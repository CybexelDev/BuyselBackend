<!DOCTYPE html>
<html>

<head>
    <title>Razorpay Test</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<button onclick="payNow()">
    Pay Now
</button>

<script>

async function payNow() {

    // =========================================
    // VALUES FROM BACKEND CREATE ORDER API
    // =========================================

    const PAYMENT_ID =
    "0fb34d66-5f0e-4202-bd64-80b8d90b9b6c";

    const ORDER_ID =
    "order_SqnRrjTRPHUGiX";

    const ACCESS_TOKEN =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzc5MTAxMDQ1LCJpYXQiOjE3NzkxMDA0NDUsImp0aSI6ImQ1ZDdjYTU5MDk2ZjRjMjJhYmM2MWMyZWYyNzgwZjkwIiwidXNlcl9pZCI6IjY2YTBjOTZhLTk2YTktNDY1OC04M2VlLTNmYTQ4NDg0MGQ1MCJ9.XG8uNXGOhrqSCtkNbejVtJgSMxcNk4NicLm-TnqwXEY";

    const options = {

        key: "rzp_test_Sm1sOIsqfa5zBr",

        amount: 999900,

        currency: "INR",

        order_id: ORDER_ID,

        name: "BuySel",

        description: "Plan Payment",

        handler: async function (response) {

            // =====================================
            // FULL RESPONSE
            // =====================================

            console.log("RAZORPAY RESPONSE:", response);

            alert(JSON.stringify(response));

            // =====================================
            // DIRECT VALUES
            // =====================================

            const razorpay_payment_id =
            response.razorpay_payment_id;

            const razorpay_order_id =
            response.razorpay_order_id;

            const razorpay_signature =
            response.razorpay_signature;

            // =====================================
            // DEBUG
            // =====================================

            console.log(
                "PAYMENT ID:",
                razorpay_payment_id
            );

            console.log(
                "ORDER ID:",
                razorpay_order_id
            );

            console.log(
                "SIGNATURE:",
                razorpay_signature
            );

            // =====================================
            // IMPORTANT CHECK
            // =====================================

            if (!razorpay_signature) {

                alert(
                    "Signature missing from Razorpay response"
                );

                return;
            }

            // =====================================
            // SEND TO BACKEND
            // =====================================

            try {

                const responseData = await fetch(
                    "http://127.0.0.1:8000/api/create-payment/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                            "application/json",

                            "Authorization":
                            "Bearer " + ACCESS_TOKEN
                        },

                        body: JSON.stringify({

                            payment_id:
                            PAYMENT_ID,

                            razorpay_order_id:
                            razorpay_order_id,

                            razorpay_payment_id:
                            razorpay_payment_id,

                            razorpay_signature:
                            razorpay_signature
                        })
                    }
                );

                const data =
                await responseData.json();

                console.log("BACKEND RESPONSE:", data);

                alert(JSON.stringify(data));

            } catch (error) {

                console.log(error);

                alert("Backend request failed");
            }
        }
    };

    const rzp = new Razorpay(options);

    rzp.open();
}

</script>

</body>

</html>
